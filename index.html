  // ======================= RENDER: CARDIO ROUND =======================
  // For bike/row/ski/run intervals. Time is pre-filled from the workout as written
  // ("2 minutes"), so if you did it as prescribed it's one tap; calories are optional.
  async function renderCardio(task) {
    root.innerHTML = `<div class="center-msg">Loading round…</div>`;
    const prescribedSets = task.segMovement.prescribed_sets || 1;
    const prescribedSeconds = parseDurationSeconds(task.segMovement.prescribed_reps)
      || parseDurationSeconds(task.segMovement.prescribed_scheme);

    const { data: recentRows } = await sb
      .from('strength_results').select('duration_seconds, calories, logged_at')
      .eq('movement_id', task.movement.id)
      .or('duration_seconds.not.is.null,calories.not.is.null')
      .order('logged_at', { ascending: false }).limit(5);
    const recent = recentRows || [];
    const defaultSeconds = prescribedSeconds != null
      ? prescribedSeconds
      : (recent.length && recent[0].duration_seconds != null ? recent[0].duration_seconds : 0);

    function draw() {
      const tabsHtml = Array.from({ length: prescribedSets }, (_, i) => {
        const n = i + 1;
        const cls = n < state.setNumber ? 'done' : (n === state.setNumber ? 'active' : '');
        return `<div class="set-tab ${cls}">${n}</div>`;
      }).join('');
      const lastLine = recent.length
        ? `Last round ${fmtDate(recent[0].logged_at)}: ${fmtCardioSet(recent[0])}`
        : `No rounds logged yet`;
      const priorRows = recent.map(r =>
        `<div class="prior-row"><span class="date">${fmtDate(r.logged_at)}</span><span class="val">${esc(fmtCardioSet(r))}</span></div>`
      ).join('') || `<div class="prior-row"><span class="date">—</span><span class="val">No history yet</span></div>`;

      root.innerHTML = `
        ${topBarHtml(false)}
        <div class="progress">Step ${state.taskIndex + 1} of ${state.tasks.length}</div>
        <div class="topline">
          <span>${esc(state.workout.workout_date)} &middot; Cardio</span>
          <span>${state.setNumber} / ${prescribedSets} rounds</span>
        </div>
        <div class="movement-name">${esc(task.movement.name)}</div>
        <div class="scheme">${esc(task.segMovement.prescribed_reps || '')}${task.segMovement.prescribed_scheme ? ' &middot; ' + esc(task.segMovement.prescribed_scheme) : ''}</div>
        <div class="set-tabs">${tabsHtml}</div>
        <div class="entry-card">
          <div class="score-row">
            <div class="score-field"><label>Minutes</label><input type="number" id="cardioMin" value="${Math.floor(defaultSeconds / 60)}" min="0"></div>
            <div class="score-field"><label>Seconds</label><input type="number" id="cardioSec" value="${defaultSeconds % 60}" min="0" max="59"></div>
            <div class="score-field"><label>Cal (optional)</label><input type="number" id="cardioCal" value="" min="0" placeholder="—"></div>
          </div>
          <div class="context-line">${lastLine}<span class="line2">Time is pre-filled from the workout — just tap Log if you did it as written</span></div>
        </div>
        ${state.error ? `<div class="error-banner" style="margin-top:16px;">${esc(state.error)}</div>` : ''}
        <div class="notes-field">
          <label for="notesInput">Notes (optional)</label>
          <input type="text" id="notesInput" placeholder="e.g. pace, how it felt">
        </div>
        <button class="log-btn" id="logCardioBtn">Log round &amp; next →</button>
        <div class="prior-sessions">
          <div class="prior-title">${esc(task.movement.name)} — last ${recent.length} round(s)</div>
          ${priorRows}
        </div>
      `;
      wireTopBar();

      document.getElementById('logCardioBtn').onclick = async () => {
        document.getElementById('logCardioBtn').disabled = true;
        const min = parseInt(document.getElementById('cardioMin').value || '0', 10) || 0;
        const sec = parseInt(document.getElementById('cardioSec').value || '0', 10) || 0;
        const total = min * 60 + sec;
        const calRaw = document.getElementById('cardioCal').value.trim();
        const cal = calRaw === '' ? null : parseInt(calRaw, 10);
        const noteVal = document.getElementById('notesInput').value.trim() || null;
        try {
          await logCardioRound(task.movement.id, state.setNumber, total > 0 ? total : null, (cal == null || isNaN(cal)) ? null : cal, noteVal);
          state.error = null;
          if (state.setNumber < prescribedSets) {
            state.setNumber += 1;
            renderCardio(task);
          } else {
            state.taskIndex += 1;
            state.setNumber = 1;
            render();
          }
        } catch (e) {
          state.error = e.message;
          draw();
        }
      };
    }
    draw();
  }

  // ======================= RENDER: STRENGTH TASK =======================
  async function renderStrength(task) {
    if (isCardioMovement(task.movement.name)) { return renderCardio(task); }
    root.innerHTML = `<div class="center-msg">Loading movement…</div>`;
    const prescribedSets = task.segMovement.prescribed_sets || 1;
    const prescribedReps = parseLeadingInt(task.segMovement.prescribed_reps) || null;
    const isBodyweight = isBodyweightMovement(task.movement.name);
    const STEP = isBodyweight ? 1 : 5;
    const { recent, bestActual, bestCalc, bestReps } = await loadMovementHistory(task.movement.id);
    const isSingle = prescribedReps === 1; // a true 1-rep attempt, i.e. a 1RM test

    let weight = recent.length
      ? Math.round((isBodyweight ? recent[0].reps_completed : recent[0].weight_lbs) || 0)
      : (isBodyweight ? (prescribedReps || 0) : 0);
    let extraWeight = recent.length && recent[0].weight_lbs ? Math.round(recent[0].weight_lbs) : 0;
    let showExtraWeight = extraWeight > 0;

    function draw() {
      const tabsHtml = Array.from({ length: prescribedSets }, (_, i) => {
        const n = i + 1;
        const cls = n < state.setNumber ? 'done' : (n === state.setNumber ? 'active' : '');
        return `<div class="set-tab ${cls}">${n}</div>`;
      }).join('');

      let lastLine, contextLine2, isPR, prBadgeText, priorRows, unitLabel, prIsEst = false;

      if (isBodyweight) {
        unitLabel = 'reps &middot; tap number to type';
        lastLine = recent.length
          ? `Last session ${fmtDate(recent[0].logged_at)}, ${recent[0].reps_completed ?? '?'} Reps${recent[0].weight_lbs ? ` @ ${recent[0].weight_lbs} lb` : ''}`
          : `No sessions logged yet`;
        contextLine2 = bestReps !== null ? `Best ever = ${bestReps} reps` : `Best ever = Unknown`;
        isPR = bestReps !== null && weight > bestReps;
        prBadgeText = '🏆 New rep PR';
        priorRows = recent.map(r =>
          `<div class="prior-row"><span class="date">${fmtDate(r.logged_at)}</span><span class="val">${r.reps_completed ?? '?'} reps${r.weight_lbs ? ` @ ${r.weight_lbs} lb` : ''}</span></div>`
        ).join('') || `<div class="prior-row"><span class="date">—</span><span class="val">No history yet</span></div>`;
      } else {
        unitLabel = 'lb &middot; tap number to type';
        lastLine = recent.length
          ? `Last session ${fmtDate(recent[0].logged_at)}, ${recent[0].reps_completed ?? '?'} Reps @ ${recent[0].weight_lbs ?? '?'} lb`
          : `No sessions logged yet`;
        // Show BOTH records so a real lift is never overshadowed by an estimate
        if (bestActual === null && bestCalc === null) {
          contextLine2 = `1RM = Unknown`;
        } else {
          const actualText = bestActual !== null ? `1RM ${Math.round(bestActual)} lb (actual)` : `1RM: none logged`;
          const calcText = bestCalc !== null ? ` · Est. ${Math.round(bestCalc)} lb` : '';
          contextLine2 = actualText + calcText;
        }
        prIsEst = false;
        if (isSingle) {
          // A true single is judged against actual singles ONLY — never against an estimate
          isPR = weight > 0 && (bestActual === null || weight > bestActual);
          prBadgeText = bestActual === null ? '🏆 First 1RM recorded' : '🏆 New 1RM PR';
        } else {
          // A multi-rep set is an estimate; it must beat everything known (actual or calculated)
          const estToday = prescribedReps ? epley(weight, prescribedReps) : weight;
          const known = Math.max(bestCalc || 0, bestActual || 0);
          isPR = known > 0 && estToday > known;
          prBadgeText = '📈 New est. 1RM high';
          prIsEst = true;
        }
        priorRows = recent.map(r =>
          `<div class="prior-row"><span class="date">${fmtDate(r.logged_at)}</span><span class="val">${r.reps_completed ?? '?'} reps @ ${r.weight_lbs ?? '?'} lb</span></div>`
        ).join('') || `<div class="prior-row"><span class="date">—</span><span class="val">No history yet</span></div>`;
      }

      root.innerHTML = `
        ${topBarHtml(false)}
        <div class="progress">Step ${state.taskIndex + 1} of ${state.tasks.length}</div>
        <div class="topline">
          <span>${esc(state.workout.workout_date)} &middot; Strength</span>
          <span>${state.setNumber} / ${prescribedSets} sets</span>
        </div>
        <div class="movement-name">${esc(task.movement.name)}</div>
        <div class="scheme">${esc(task.segMovement.prescribed_reps || '')}${task.segMovement.prescribed_scheme ? ' &middot; ' + esc(task.segMovement.prescribed_scheme) : ''}</div>
        <div class="set-tabs">${tabsHtml}</div>
        <div class="entry-card">
          <div class="weight-row">
            <button class="stepper" id="decBtn">−</button>
            <div>
              <div class="weight-display" id="weightVal">${weight}</div>
              <div class="unit">${unitLabel}</div>
            </div>
            <button class="stepper" id="incBtn">+</button>
          </div>
          <div class="context-line">${lastLine}<span class="line2">${contextLine2}</span></div>
          <div class="pr-badge${prIsEst ? ' est' : ''}" style="display:${isPR ? 'inline-flex' : 'none'}">${prBadgeText}</div>
          ${isBodyweight ? `
            <button class="nav-link-btn" id="toggleExtraWeightBtn" type="button" style="margin-top:14px;">
              ${showExtraWeight ? '− Remove added weight' : '+ Add weight (e.g. a ball or vest)'}
            </button>
            ${showExtraWeight ? `
              <div class="score-row" style="margin-top:8px;">
                <div class="score-field"><label>Added weight (lb)</label><input type="number" id="extraWeightInput" value="${extraWeight}" min="0"></div>
              </div>
            ` : ''}
          ` : ''}
        </div>
        ${state.error ? `<div class="error-banner" style="margin-top:16px;">${esc(state.error)}</div>` : ''}
        <div class="notes-field">
          <label for="notesInput">Notes (optional)</label>
          <input type="text" id="notesInput" placeholder="e.g. used straps, felt heavy">
        </div>
        <button class="log-btn" id="logBtn">Log set &amp; next →</button>
        <div class="prior-sessions">
          <div class="prior-title">${esc(task.movement.name)} — last ${recent.length} session(s), any rep count</div>
          ${priorRows}
        </div>
      `;
      wireTopBar();

      // Press-and-hold acceleration: a quick tap nudges by STEP; holding down
      // repeats automatically, speeding up the longer it's held. This avoids
      // needing dozens of taps to move a heavy lift from e.g. 135 to 275.
      // Important: draw() fully replaces the DOM (including these buttons),
      // so mid-hold we only update the displayed number directly — a full
      // draw() only happens once, on release, to refresh the PR badge/context.
      function wireHoldStepper(btn, direction) {
        let holdTimer = null, repeatTimer = null;
        const weightValEl = () => document.getElementById('weightVal');
        const doStep = () => {
          weight = Math.max(0, weight + direction * STEP);
          const el = weightValEl();
          if (el) el.textContent = weight;
        };
        const startHolding = (e) => {
          e.preventDefault();
          doStep(); // immediate single-tap response
          holdTimer = setTimeout(() => {
            let interval = 260;
            const tick = () => {
              doStep();
              interval = Math.max(60, interval - 25); // accelerate
              repeatTimer = setTimeout(tick, interval);
            };
            tick();
          }, 350);
        };
        const stopHolding = () => {
          clearTimeout(holdTimer);
          clearTimeout(repeatTimer);
          draw(); // one full re-render now that the value has settled
        };
        btn.addEventListener('pointerdown', startHolding);
        btn.addEventListener('pointerup', stopHolding);
        btn.addEventListener('pointerleave', stopHolding);
        btn.addEventListener('pointercancel', stopHolding);
      }
      wireHoldStepper(document.getElementById('decBtn'), -1);
      wireHoldStepper(document.getElementById('incBtn'), 1);

      // Tap the number itself to type an exact value directly, using the
      // phone's native numeric keypad — fastest path for a big jump.
      document.getElementById('weightVal').onclick = () => {
        const displayEl = document.getElementById('weightVal');
        const input = document.createElement('input');
        input.type = 'number';
        input.inputMode = 'numeric';
        input.className = 'weight-input';
        input.value = weight;
        displayEl.replaceWith(input);
        input.focus();
        input.select();
        const commit = () => {
          const parsed = parseInt(input.value, 10);
          weight = isNaN(parsed) ? weight : Math.max(0, parsed);
          draw();
        };
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { input.blur(); } });
      };

      if (isBodyweight) {
        const toggleBtn = document.getElementById('toggleExtraWeightBtn');
        if (toggleBtn) {
          toggleBtn.onclick = () => {
            const existingInput = document.getElementById('extraWeightInput');
            if (existingInput) {
              const parsed = parseInt(existingInput.value, 10);
              extraWeight = isNaN(parsed) ? extraWeight : Math.max(0, parsed);
            }
            showExtraWeight = !showExtraWeight;
            draw();
          };
        }
      }

      document.getElementById('logBtn').onclick = async () => {
        document.getElementById('logBtn').disabled = true;
        const noteVal = document.getElementById('notesInput').value.trim() || null;
        const repsToLog = isBodyweight ? weight : prescribedReps;
        let weightToLog = isBodyweight ? null : weight;
        if (isBodyweight && showExtraWeight) {
          const extraInput = document.getElementById('extraWeightInput');
          const parsed = extraInput ? parseInt(extraInput.value, 10) : NaN;
          if (!isNaN(parsed) && parsed > 0) weightToLog = parsed;
        }
        try {
          await logStrengthSet(task.segMovement.id, task.movement.id, state.setNumber, repsToLog, weightToLog, noteVal);
          state.error = null;
          if (state.setNumber < prescribedSets) {
            state.setNumber += 1;
            renderStrength(task);
          } else {
            state.taskIndex += 1;
            state.setNumber = 1;
            render();
          }
        } catch (e) {
          state.error = e.message;
          draw();
        }
      };
    }
    draw();
  }

  // ======================= RENDER: WOD TASK =======================
  function renderWod(task) {
    const seg = task.segment;
    let scoreType = seg.score_type;
    let rxState = 'rx';

    function fieldsHtml() {
      if (scoreType === 'time') {
        return `<div class="score-row">
          <div class="score-field"><label>Minutes</label><input type="number" id="minInput" value="10" min="0"></div>
          <div class="score-field"><label>Seconds</label><input type="number" id="secInput" value="0" min="0" max="59"></div>
        </div>`;
      }
      if (scoreType === 'rounds_reps') {
        return `<div class="score-row">
          <div class="score-field"><label>Rounds</label><input type="number" id="roundsInput" value="0" min="0"></div>
          <div class="score-field"><label>+ Reps</label><input type="number" id="extraInput" value="0" min="0"></div>
        </div>`;
      }
      if (scoreType === 'reps') {
        return `<div class="score-row"><div class="score-field"><label>Total reps</label><input type="number" id="repsInput" value="0" min="0"></div></div>`;
      }
      if (scoreType === 'calories') {
        return `<div class="score-row"><div class="score-field"><label>Calories</label><input type="number" id="calInput" value="0" min="0"></div></div>`;
      }
      if (scoreType === 'distance') {
        return `<div class="score-row"><div class="score-field"><label>Distance</label><input type="text" id="distInput" placeholder="e.g. 5000m"></div></div>`;
      }
      return `<div class="context-line">No score to log for this one — just mark it done.</div>`;
    }

    root.innerHTML = `
      ${topBarHtml(false)}
      <div class="progress">Step ${state.taskIndex + 1} of ${state.tasks.length}</div>
      <div class="topline"><span>${esc(state.workout.workout_date)} &middot; WOD</span></div>
      <div class="movement-name">${esc(seg.wod_name || seg.title || 'WOD')}</div>
      <div class="scheme">${seg.wod_name && seg.title ? esc(seg.title) : ''}</div>
      ${wodDetailsHtml(seg, task.movements, state.workout && state.workout.raw_text)}
      <div class="entry-card">
        ${fieldsHtml()}
        <div class="toggle-row">
          <button class="toggle-btn active" data-rx="rx">Rx</button>
          <button class="toggle-btn" data-rx="scaled">Scaled</button>
        </div>
      </div>
      ${state.error ? `<div class="error-banner" style="margin-top:16px;">${esc(state.error)}</div>` : ''}
      <div class="notes-field">
        <label for="wodNotesInput">Notes (optional)</label>
        <input type="text" id="wodNotesInput" placeholder="e.g. used 135 lb on the snatch">
      </div>
      <button class="log-btn" id="logWodBtn">Log result &amp; next →</button>
    `;
    wireTopBar();

    root.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.onclick = () => {
        rxState = btn.dataset.rx;
        root.querySelectorAll('.toggle-btn').forEach(b => b.classList.toggle('active', b === btn));
      };
    });

    document.getElementById('logWodBtn').onclick = async () => {
      document.getElementById('logWodBtn').disabled = true;
      const payload = { score_type: scoreType, rx_or_scaled: rxState };
      const generalNote = document.getElementById('wodNotesInput').value.trim();
      if (scoreType === 'time') {
        const min = parseInt(document.getElementById('minInput').value || '0', 10);
        const sec = parseInt(document.getElementById('secInput').value || '0', 10);
        payload.time_seconds = min * 60 + sec;
      } else if (scoreType === 'rounds_reps') {
        payload.rounds_completed = parseInt(document.getElementById('roundsInput').value || '0', 10);
        payload.extra_reps = parseInt(document.getElementById('extraInput').value || '0', 10);
      } else if (scoreType === 'reps') {
        payload.total_reps = parseInt(document.getElementById('repsInput').value || '0', 10);
      } else if (scoreType === 'calories') {
        payload.calories = parseInt(document.getElementById('calInput').value || '0', 10);
      }
      let distNote = null;
      if (scoreType === 'distance') {
        const dv = document.getElementById('distInput').value.trim();
        if (dv) distNote = `Distance: ${dv}`;
      }
      payload.notes = [distNote, generalNote].filter(Boolean).join(' — ') || null;
      try {
        await logWodResult(seg.id, payload);
        state.error = null;
        state.taskIndex += 1;
        render();
      } catch (e) {
        state.error = e.message;
        renderWod(task);
      }
    };
  }

  // ======================= CHALLENGE =======================
  // A gym challenge (e.g. the Echo Bike Challenge). The dates, name and instructions live in the
  // database, so a new challenge needs no code change. Everything here is tolerant of the
  // challenge tables not existing yet: the rest of the app works exactly as before without them.
  async function loadChallengeState() {
    state.challenge = null; state.challengeTotal = 0; state.isAdmin = false;
    try {
      const today = localDateStr();
      const { data: ch, error } = await sb.from('challenges').select('*')
        .lte('start_date', today).gte('end_date', today)
        .order('start_date', { ascending: false }).limit(1);
      if (error) throw error;
      if (ch && ch.length) {
        state.challenge = ch[0];
        state.challengeTotal = await fetchChallengeTotal(ch[0].id);
      }
      const { data: isAdm } = await sb.rpc('is_challenge_admin');
      state.isAdmin = isAdm === true;
    } catch (e) { /* no challenge tables yet, or offline: simply no challenge buttons */ }
  }
  async function fetchChallengeTotal(challengeId) {
    const { data } = await sb.from('challenge_entries').select('value')
      .eq('challenge_id', challengeId).eq('status', 'accepted');
    return (data || []).reduce((sum, r) => sum + (r.value || 0), 0);
  }

  function challengeHomeHtml() {
    let h = '';
    if (state.challenge) {
      h += `<button class="secondary-btn" id="homeChallengeBtn" type="button">Log Challenge Progress</button>
        <div class="home-note" style="margin:6px 0 0;">${esc(state.challenge.name)} · you: ${state.challengeTotal} ${esc(state.challenge.unit_label || '')}</div>`;
    }
    if (state.isAdmin) {
      h += `<div style="margin:8px 0 6px;"><button class="home-link" id="homeOrganizerBtn" type="button">Challenge Organizer →</button></div>`;
    }
    return h;
  }
  function wireChallengeHome() {
    const logBtn = document.getElementById('homeChallengeBtn');
    if (logBtn) logBtn.onclick = () => renderChallenge();
    const orgBtn = document.getElementById('homeOrganizerBtn');
    if (orgBtn) orgBtn.onclick = () => { window.location.href = 'organizer.html'; };
  }

  // Shrinks a phone photo to a small JPEG (plus a thumbnail) before upload, so 700 photos fit
  // easily in free storage, and fingerprints the original so the same photo can't quietly be
  // used twice.
  async function prepareChallengePhoto(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      const toJpeg = (maxSide, quality) => new Promise((resolve, reject) => {
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(b => b ? resolve(b) : reject(new Error('Could not process that photo.')), 'image/jpeg', quality);
      });
      const full = await toJpeg(1280, 0.8);
      const thumb = await toJpeg(320, 0.7);
      let hash = null;
      try {
        const digest = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
        hash = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
      } catch (e) { /* fingerprinting is a convenience; skip if the browser can't */ }
      return { full, thumb, hash };
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function fmtMonthDay(dateStr) {
    return parseDateOnly(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  // First time only: ask for a name. Only organizers ever see it.
  function renderChallengeName(profile, errorMsg) {
    root.innerHTML = `
      ${topBarHtml(true)}
      <div class="home-label">${esc(state.challenge.name)}</div>
      <div class="home-date" style="font-size:32px;">${profile ? 'Edit your name' : "What's your name?"}</div>
      <div class="home-note">Only the challenge organizer sees your name and email. Other athletes see nothing.</div>
      ${errorMsg ? `<div class="error-banner">${esc(errorMsg)}</div>` : ''}
      <div class="notes-field">
        <label for="chNameInput">Your name</label>
        <input type="text" id="chNameInput" maxlength="60" autocomplete="name" value="${esc(profile ? profile.display_name : '')}">
      </div>
      <button class="log-btn" id="chNameSave" type="button">${profile ? 'Save' : 'Continue'}</button>
    `;
    wireTopBar(() => (profile ? renderChallenge() : goHome()));
    document.getElementById('chNameSave').onclick = async () => {
      const name = document.getElementById('chNameInput').value.trim();
      if (!name) { renderChallengeName(profile, 'Please enter your name.'); return; }
      const { error } = await sb.from('profiles').upsert({ user_id: state.session.user.id, display_name: name }, { onConflict: 'user_id' });
      if (error) { renderChallengeName(profile, error.message); return; }
      renderChallenge();
    };
  }

  async function renderChallenge(flash) {
    const ch = state.challenge;
    if (!ch) { goHome(); return; }
    root.innerHTML = `${topBarHtml(true)}<div class="center-msg">Loading…</div>`;
    wireTopBar(() => goHome());
    const uid = state.session.user.id;

    const { data: profRows, error: pErr } = await sb.from('profiles').select('*').eq('user_id', uid).limit(1);
    if (pErr) { root.innerHTML = `${topBarHtml(true)}<div class="error-banner">${esc(pErr.message)}</div>`; wireTopBar(() => goHome()); return; }
    const profile = (profRows && profRows[0]) || null;
    if (!profile) { renderChallengeName(null); return; }

    const { data: entryRows, error: eErr } = await sb.from('challenge_entries').select('*')
      .eq('challenge_id', ch.id)
      .order('entry_date', { ascending: false });
    if (eErr) { root.innerHTML = `${topBarHtml(true)}<div class="error-banner">${esc(eErr.message)}</div>`; wireTopBar(() => goHome()); return; }
    let entries = entryRows || [];
    let editingId = null;

    const today = localDateStr();
    const maxDate = today < ch.end_date ? today : ch.end_date;
    const unit = ch.unit_label || '';
    const $ = (id) => document.getElementById(id);
    const counted = () => entries.filter(e => e.status === 'accepted');
    const total = () => counted().reduce((sum, e) => sum + (e.value || 0), 0);

    root.innerHTML = `
      ${topBarHtml(true)}
      <div class="home-label">${esc(fmtMonthDay(ch.start_date))} – ${esc(fmtMonthDay(ch.end_date))}</div>
      <div class="home-date" style="font-size:32px;">${esc(ch.name)}</div>
      <div class="home-note">Hi, ${esc(profile.display_name)} · <button class="home-link" id="chEditName" type="button">edit name</button></div>
      ${flash ? `<div class="flash-ok" id="chFlash">${esc(flash)}</div>` : ''}

      <div class="entry-card" style="text-align:center;">
        <div class="ch-total" id="chTotal">${total()}</div>
        <div class="ch-total-label" id="chTotalLabel"></div>
      </div>

      ${ch.instructions ? `<div class="wod-details"><div class="wod-desc" style="font-size:19px;">${esc(ch.instructions)}</div></div>` : ''}

      <div class="entry-card">
        <div class="notes-field" style="margin-top:0;">
          <label for="chDate">Date</label>
          <input type="date" id="chDate" min="${esc(ch.start_date)}" max="${esc(maxDate)}" value="${esc(maxDate)}">
        </div>
        <div class="notes-field">
          <label for="chValue">${esc(unit.charAt(0).toUpperCase() + unit.slice(1))} (the CALORIES box, bottom right of the monitor)</label>
          <input type="number" inputmode="numeric" id="chValue" min="1" max="3000" placeholder="e.g. 49">
        </div>
        <div class="notes-field">
          <label for="chPhoto">Photo of the monitor (required)</label>
          <input type="file" id="chPhoto" accept="image/*">
          <img id="chPreview" alt="" style="display:none;max-width:100%;border-radius:10px;margin-top:10px;">
        </div>
        <div class="error-banner" id="chError" style="display:none;margin-top:14px;"></div>
        <button class="log-btn" id="chSave" type="button">Save</button>
      </div>

      <div class="prior-title" style="margin-top:26px;">Your entries</div>
      <div id="chEntries"></div>
    `;
    wireTopBar(() => goHome());
    $('chEditName').onclick = () => renderChallengeName(profile);

    // A "Saved…" confirmation shouldn't linger once the athlete moves on to editing or removing something
    const clearFlash = () => { const f = $('chFlash'); if (f) f.remove(); };
    const showError = (msg) => { const b = $('chError'); b.textContent = msg; b.style.display = msg ? 'block' : 'none'; };
    function updateTotal() {
      state.challengeTotal = total();
      $('chTotal').textContent = String(total());
      $('chTotalLabel').textContent = `your total ${unit} · ${counted().length} ${counted().length === 1 ? 'entry' : 'entries'}`;
    }
    updateTotal();

    $('chPhoto').onchange = () => {
      const f = $('chPhoto').files && $('chPhoto').files[0];
      const img = $('chPreview');
      if (!f) { img.style.display = 'none'; return; }
      try { img.src = URL.createObjectURL(f); img.style.display = 'block'; } catch (e) { /* preview is optional */ }
    };

    function drawEntries() {
      const el = $('chEntries');
      if (!entries.length) { el.innerHTML = `<div class="home-note">Nothing logged yet.</div>`; return; }
      el.innerHTML = entries.map(e => {
        if (editingId === e.id) {
          return `<div class="ch-row"><div style="width:100%;">
            <div class="score-row">
              <div class="score-field"><label>Date</label><input type="date" id="editDate" min="${esc(ch.start_date)}" max="${esc(maxDate)}" value="${esc(e.entry_date)}"></div>
              <div class="score-field"><label>${esc(unit)}</label><input type="number" inputmode="numeric" id="editValue" min="1" max="3000" value="${e.value}"></div>
            </div>
            <div class="ch-actions" style="margin-top:10px;">
              <button class="home-link" id="editSave" type="button">Save</button>
              <button class="home-link" id="editCancel" type="button">Cancel</button>
            </div></div></div>`;
        }
        const rejected = e.status === 'rejected';
        return `<div class="ch-row${rejected ? ' ch-rejected' : ''}">
          <div>
            <div class="ch-row-main">${esc(fmtShortWeekday(e.entry_date))} · ${e.value} ${esc(unit)}</div>
            <div class="ch-row-sub">${rejected ? 'Not counted' + (e.reject_reason ? ': ' + esc(e.reject_reason) : '') : 'Counted'}${e.edited_at ? ' · edited' : ''}</div>
          </div>
          ${rejected ? '' : `<div class="ch-actions">
            <button class="home-link" data-edit="${e.id}" type="button">Edit</button>
            <button class="home-link" data-del="${e.id}" type="button">Remove</button></div>`}
        </div>`;
      }).join('');

      el.querySelectorAll('[data-edit]').forEach(b => { b.onclick = () => { editingId = Number(b.dataset.edit); drawEntries(); }; });
      const cancel = $('editCancel'); if (cancel) cancel.onclick = () => { editingId = null; drawEntries(); };
      const save = $('editSave');
      if (save) save.onclick = async () => {
        const dateVal = $('editDate').value, valueNum = parseInt($('editValue').value, 10);
        if (!dateVal || !(valueNum > 0)) { showError('Enter a date and a number.'); return; }
        const patch = { value: valueNum, entry_date: dateVal, edited_at: new Date().toISOString() };
        const { error } = await sb.from('challenge_entries').update(patch).eq('id', editingId);
        if (error) { showError(error.message); return; }
        showError(''); clearFlash();
        Object.assign(entries.find(x => x.id === editingId), patch);
        entries.sort((a, b) => (a.entry_date < b.entry_date ? 1 : a.entry_date > b.entry_date ? -1 : 0));
        editingId = null; drawEntries(); updateTotal();
      };
      el.querySelectorAll('[data-del]').forEach(b => {
        b.onclick = async () => {
          if (!confirm('Remove this entry?')) return;
          const entry = entries.find(x => x.id === Number(b.dataset.del));
          const { error } = await sb.from('challenge_entries').delete().eq('id', entry.id);
          if (error) { showError(error.message); return; }
          try { await sb.storage.from('challenge-photos').remove([entry.photo_path, entry.thumb_path].filter(Boolean)); } catch (e) { /* leftover file is harmless */ }
          showError(''); clearFlash();
          entries = entries.filter(x => x.id !== entry.id);
          drawEntries(); updateTotal();
        };
      });
    }
    drawEntries();

    $('chSave').onclick = async () => {
      const dateVal = $('chDate').value;
      const valueNum = parseInt($('chValue').value, 10);
      const file = $('chPhoto').files && $('chPhoto').files[0];
      if (!dateVal || dateVal < ch.start_date || dateVal > maxDate) { showError(`Pick a date from ${fmtMonthDay(ch.start_date)} to ${fmtMonthDay(maxDate)}.`); return; }
      if (!(valueNum > 0)) { showError(`Enter the ${unit} shown on the monitor.`); return; }
      if (!file) { showError('A photo of the monitor is required.'); return; }

      showError('');
      const btn = $('chSave'); btn.disabled = true; btn.textContent = 'Saving…';
      const bucket = sb.storage.from('challenge-photos');
      let fullPath = null, thumbPath = null;
      try {
        const prepared = await prepareChallengePhoto(file);
        const base = `${uid}/${ch.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        fullPath = `${base}.jpg`; thumbPath = `${base}_t.jpg`;
        let up = await bucket.upload(fullPath, prepared.full, { contentType: 'image/jpeg' });
        if (up.error) throw up.error;
        up = await bucket.upload(thumbPath, prepared.thumb, { contentType: 'image/jpeg' });
        if (up.error) throw up.error;
        const { error } = await sb.from('challenge_entries').insert({
          challenge_id: ch.id, entry_date: dateVal, value: valueNum,
          photo_path: fullPath, thumb_path: thumbPath, photo_hash: prepared.hash,
        });
        if (error) throw error;
        state.challengeTotal = total() + valueNum;
        renderChallenge(`Saved: ${valueNum} ${unit} for ${fmtShortWeekday(dateVal)}`);
      } catch (e) {
        // Don't leave orphaned photos behind if the entry itself didn't save
        const stray = [fullPath, thumbPath].filter(Boolean);
        if (stray.length) { try { await bucket.remove(stray); } catch (_) { /* ignore */ } }
        showError(e.message || String(e));
        btn.disabled = false; btn.textContent = 'Save';
      }
    };
  }

  // ======================= HOME =======================
  // The landing screen: the day's workout, with one clear button to log it.
  // The button reflects where you are: nothing logged yet, partly logged, or finished.
  function homeStatus() {
    const tasks = state.tasks || [];
    if (!tasks.length) return 'none';               // nothing loggable in this post
    if (state.taskIndex >= tasks.length) return 'done';
    return state.anyLogged ? 'partial' : 'fresh';
  }

  function renderHome() {
    if (state.loading) { root.innerHTML = `<div class="center-msg">Loading…</div>`; return; }
    const w = state.workout;

    if (!w) {
      root.innerHTML = `
        ${topBarHtml(false)}
        <div class="home-date">No workout posted yet</div>
        <div class="home-note">Havoc posts each workout the evening before.</div>
        ${challengeHomeHtml()}
        <button class="secondary-btn" id="homeCustomBtn" type="button">Log a Custom Workout</button>
      `;
      wireTopBar();
      wireChallengeHome();
      document.getElementById('homeCustomBtn').onclick = () => renderCustomEntry();
      return;
    }

    const isToday = w.workout_date === localDateStr();
    const status = homeStatus();
    const label = { fresh: isToday ? "Log Today's WOD Results" : 'Log WOD Results', partial: 'Continue Logging WOD Results', done: 'Review / Edit WOD Results' }[status];
    const statusLine = status === 'done' ? '✅ WOD results logged' : status === 'partial' ? 'WOD results partly logged' : '';
    const full = cleanPostText(w.raw_text);

    root.innerHTML = `
      ${topBarHtml(false)}
      <div class="home-label">${isToday ? 'Today' : 'Most recent workout'}</div>
      <div class="home-date">${esc(fmtFullDate(w.workout_date))}</div>
      ${isToday ? '' : `<div class="home-note">No class workout posted for today.</div>`}
      ${statusLine ? `<div class="home-status">${statusLine}</div>` : ''}
      ${label ? `<button class="log-btn" id="homePrimaryBtn" type="button" style="margin-top:6px;">${label}</button>` : ''}
      ${challengeHomeHtml()}
      ${isToday ? '' : `<button class="secondary-btn" id="homeCustomBtn" type="button">Log a Custom Workout</button>`}
      ${full ? `<div class="home-workout"><div class="home-label">Workout</div><div class="wod-desc">${esc(full)}</div></div>` : ''}
    `;
    wireTopBar();
    wireChallengeHome();

    const primary = document.getElementById('homePrimaryBtn');
    if (primary) primary.onclick = () => {
      if (status === 'done') renderDayReview(w.workout_date, () => goHome());
      else startEntry();
    };
    const custom = document.getElementById('homeCustomBtn');
    if (custom) custom.onclick = () => renderCustomEntry();
  }

  // Begin (or resume) logging. The loader has already worked out where you left off.
  function startEntry() {
    state.view = 'entry';
    render();
  }

  // The last step of an entry flow is done. Go where we were headed, otherwise home.
  function finishEntry() {
    if (state.onEntryDone) {
      const next = state.onEntryDone;
      state.onEntryDone = null;
      next();
      return;
    }
    goHome();
  }

  // ======================= MAIN RENDER =======================
  function render() {
    if (!state.session) { renderAuth(); return; }
    if (state.view === 'home') { renderHome(); return; }
    if (state.taskIndex >= state.tasks.length) { finishEntry(); return; }
    const task = state.tasks[state.taskIndex];
    if (task.type === 'strength') renderStrength(task);
    else if (task.type === 'wod') renderWod(task);
  }

  init();
</script>
</body>
