<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Havoc Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #17181A;
    --panel: #1F2124;
    --panel-2: #26282C;
    --chalk: #F2EFE9;
    --chalk-dim: #A9A7A2;
    --accent: #C1443B;
    --accent-dim: #7A2C27;
    --good: #7FA66B;
    --bad: #C1443B;
    --radius: 14px;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--chalk);
    font-family: 'Barlow Condensed', ui-sans-serif, system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #root {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100%;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(32px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
  }

  h1, h2, h3, p { margin: 0; }

  /* ---------- Shared ---------- */
  .topline {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    color: var(--chalk-dim);
    font-size: 18px;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }
  .movement-name {
    font-size: 40px;
    font-weight: 700;
    line-height: 1.05;
    margin: 2px 0 2px;
  }
  .scheme {
    color: var(--chalk-dim);
    font-size: 22px;
    margin-bottom: 22px;
  }
  .set-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .set-tab {
    flex: 1; text-align: center; padding: 10px 0; border-radius: 10px;
    background: var(--panel); color: var(--chalk-dim); font-size: 20px; font-weight: 600;
    border: 2px solid transparent;
  }
  .set-tab.done { color: var(--chalk); }
  .set-tab.active { border-color: var(--accent); color: var(--chalk); background: var(--panel-2); }

  .entry-card {
    background: var(--panel); border-radius: var(--radius); padding: 28px 16px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .weight-row { display: flex; align-items: center; justify-content: center; gap: 18px; width: 100%; }
  .stepper {
    width: 64px; height: 64px; border-radius: 50%; background: var(--panel-2); color: var(--chalk);
    font-size: 30px; font-weight: 700; border: none; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; user-select: none; touch-action: manipulation;
  }
  .stepper:active { background: var(--accent-dim); }
  .weight-display {
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 76px; font-weight: 700;
    min-width: 170px; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    touch-action: manipulation; cursor: pointer; border-bottom: 2px dashed transparent;
  }
  .weight-display:active { border-bottom-color: var(--chalk-dim); }
  .weight-input {
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 76px; font-weight: 700;
    min-width: 170px; max-width: 220px; text-align: center; font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em; background: var(--panel-2); color: var(--chalk); border: 2px solid var(--accent);
    border-radius: 10px; padding: 0 4px;
  }
  .unit { color: var(--chalk-dim); font-size: 22px; margin-top: -4px; text-align: center; }

  .context-line { margin-top: 18px; font-size: 21px; color: var(--chalk-dim); text-align: center; line-height: 1.5; }
  .context-line .line2 { display: block; margin-top: 2px; }
  .context-line b { color: var(--chalk); font-weight: 600; }
  .pr-badge {
    display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--chalk);
    font-size: 20px; font-weight: 700; padding: 5px 14px 6px; border-radius: 999px; margin-top: 10px;
  }
  /* A calculated high is real information but not a lift you actually did,
     so it's visually quieter than a true PR. */
  .pr-badge.est { background: transparent; border: 2px solid var(--accent); }

  .log-btn {
    margin-top: 26px; width: 100%; padding: 20px 0; border-radius: 12px; border: none;
    background: var(--accent); color: var(--chalk); font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px; font-weight: 700; letter-spacing: 0.01em;
  }
  .log-btn:active { background: var(--accent-dim); }
  .log-btn:disabled { opacity: 0.5; }
  .secondary-btn {
    margin-top: 12px; width: 100%; padding: 14px 0; border-radius: 12px; border: 2px solid var(--panel-2);
    background: transparent; color: var(--chalk-dim); font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px; font-weight: 600;
  }

  .prior-sessions { margin-top: 30px; }
  .prior-title { font-size: 20px; color: var(--chalk-dim); margin-bottom: 10px; }
  .prior-row {
    display: flex; justify-content: space-between; padding: 10px 4px;
    border-bottom: 1px solid var(--panel-2); font-size: 21px;
  }
  .prior-row .date { color: var(--chalk-dim); }
  .prior-row .val { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-variant-numeric: tabular-nums; }

  .note { margin-top: 28px; text-align: center; color: var(--chalk-dim); font-size: 16px; opacity: 0.7; }
  .notes-field { width: 100%; margin-top: 18px; }
  .notes-field label { display: block; color: var(--chalk-dim); font-size: 17px; margin-bottom: 6px; }
  .notes-field input {
    font-family: 'Barlow Condensed', sans-serif; font-size: 18px; padding: 12px 14px;
  }
  .error-banner {
    background: var(--accent-dim); color: var(--chalk); padding: 14px 16px; border-radius: 10px;
    font-size: 18px; margin-bottom: 16px;
  }
  .center-msg { text-align: center; color: var(--chalk-dim); font-size: 22px; margin-top: 60px; line-height: 1.5; }

  /* ---------- Auth screen ---------- */
  .auth-wrap { display: flex; flex-direction: column; justify-content: center; flex: 1; gap: 18px; }
  .auth-title { font-size: 40px; font-weight: 700; text-align: center; margin: 0 0 4px; }
  .auth-sub { color: var(--chalk-dim); font-size: 19px; text-align: center; margin-bottom: 16px; }
  .havoc-logo { display: block; margin: 0 auto; max-height: 90px; width: auto; max-width: 70%; border-radius: 8px; }
  input[type="email"], input[type="number"], input[type="text"] {
    width: 100%; padding: 16px; border-radius: 10px; border: 2px solid var(--panel-2);
    background: var(--panel); color: var(--chalk); font-size: 22px; font-family: 'JetBrains Mono', monospace;
  }
  input:focus { outline: none; border-color: var(--accent); }

  /* ---------- WOD screen ---------- */
  .score-row { display: flex; gap: 12px; width: 100%; margin-top: 10px; }
  .score-field { flex: 1; text-align: center; }
  .score-field label { display: block; color: var(--chalk-dim); font-size: 18px; margin-bottom: 6px; }
  .score-field input { text-align: center; font-size: 32px; padding: 14px; }
  .toggle-row { display: flex; gap: 8px; margin-top: 18px; width: 100%; flex-wrap: wrap; }
  .toggle-btn {
    flex: 1; min-width: 90px; padding: 12px 0; border-radius: 10px; background: var(--panel-2); color: var(--chalk-dim);
    border: 2px solid transparent; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 600;
  }
  .toggle-btn.active { border-color: var(--accent); color: var(--chalk); }
  input[type="date"] {
    width: 100%; padding: 14px; border-radius: 10px; border: 2px solid var(--panel-2);
    background: var(--panel); color: var(--chalk); font-size: 20px; font-family: 'Barlow Condensed', sans-serif;
  }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; min-height: 40px; }
  .hamburger-btn {
    background: none; border: none; color: var(--chalk); font-size: 28px; padding: 4px 10px 4px 0;
    line-height: 1; touch-action: manipulation;
  }
  .back-btn {
    background: none; border: none; color: var(--chalk); font-size: 20px; padding: 6px 4px;
    font-family: 'Barlow Condensed', sans-serif; touch-action: manipulation;
  }
  .menu-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .menu-overlay.open { opacity: 1; pointer-events: auto; }
  .menu-panel {
    position: fixed; top: 0; left: 0; right: 0; background: var(--panel); z-index: 101;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 24px; border-radius: 0 0 18px 18px;
    transform: translateY(-105%); transition: transform 0.25s ease; max-width: 480px; margin: 0 auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .menu-panel.open { transform: translateY(0); }
  .menu-item {
    display: block; width: 100%; text-align: left; background: var(--panel-2); color: var(--chalk);
    border: none; border-radius: 10px; padding: 18px 18px; font-size: 24px; font-weight: 600;
    font-family: 'Barlow Condensed', sans-serif; margin-bottom: 10px; text-decoration: none; touch-action: manipulation;
  }
  .menu-item:active { background: var(--accent-dim); }
  .menu-close-btn {
    display: block; width: 100%; text-align: center; background: none; border: none;
    color: var(--chalk-dim); font-size: 19px; padding: 10px; margin-top: 4px; font-family: 'Barlow Condensed', sans-serif;
  }
  .nav-link-btn {
    background: none; border: none; color: var(--chalk-dim); font-size: 18px;
    font-family: 'Barlow Condensed', sans-serif; padding: 0; text-decoration: underline;
  }
  .page-title { font-size: 40px; font-weight: 700; margin: 6px 0 12px; }
  .day-pick-list { display: flex; flex-direction: column; gap: 8px; }

  .home-link { background: none; border: none; color: var(--chalk-dim); font-family: inherit; font-size: 19px;
    text-decoration: underline; padding: 6px 4px; cursor: pointer; touch-action: manipulation; }
  .flash-ok { background: #2c4a2c; color: var(--chalk); padding: 12px 16px; border-radius: 10px; font-size: 19px; margin: 8px 0 14px; }
  .ch-total { font-family: 'JetBrains Mono', monospace; font-size: 64px; font-weight: 700; line-height: 1; }
  .ch-total-label { color: var(--chalk-dim); font-size: 20px; margin-top: 6px; }
  .ch-row { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    background: var(--panel); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .ch-row-main { font-size: 22px; font-weight: 600; }
  .ch-row-sub { color: var(--chalk-dim); font-size: 17px; }
  .ch-rejected .ch-row-main { text-decoration: line-through; color: var(--chalk-dim); }
  .ch-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .home-label { color: var(--chalk-dim); font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 2px; }
  .home-date { font-size: 36px; font-weight: 700; line-height: 1.1; margin: 0 0 8px; }
  .home-note { color: var(--chalk-dim); font-size: 20px; margin-bottom: 10px; }
  .home-status { color: var(--chalk-dim); font-size: 21px; margin-bottom: 4px; }
  .home-workout { background: var(--panel); border-radius: var(--radius); padding: 16px; margin-top: 22px; }
  .wod-details { background: var(--panel); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
  .wod-desc { font-size: 21px; line-height: 1.45; white-space: pre-wrap; }
  .wod-dim { color: var(--chalk-dim); }
  .wod-full { margin-top: 10px; }
  .wod-full summary { color: var(--chalk-dim); font-size: 18px; padding: 6px 0; cursor: pointer; }
  .wod-full .wod-desc { font-size: 18px; color: var(--chalk-dim); margin-top: 6px; }
  .wod-full:first-child { margin-top: 0; }
  .review-block .wod-details { background: var(--panel-2); margin: 4px 0 12px; }

  .review-block { background: var(--panel); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .review-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .review-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--panel-2); font-size: 19px;
  }
  .review-row:last-of-type { border-bottom: none; }
  .review-set-label { color: var(--chalk-dim); flex-shrink: 0; }
  .review-set-val { font-family: 'JetBrains Mono', monospace; font-weight: 600; flex: 1; text-align: right; }
  .review-note { display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 500; font-style: italic;
    color: var(--chalk-dim); font-size: 15px; text-align: right; }
  .review-edit-form { background: var(--panel-2); border-radius: 10px; padding: 12px; margin: 6px 0; }
  .day-pick-row {
    background: var(--panel); border: none; border-radius: 10px; padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    color: var(--chalk); font-family: 'Barlow Condensed', sans-serif; text-align: left;
  }
  .day-pick-row:active { background: var(--panel-2); }
  .day-pick-row .dp-date { font-size: 21px; font-weight: 600; }
  .progress { color: var(--chalk-dim); font-size: 16px; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="root"><div class="center-msg">Loading…</div></div>

<script>
  // ======================= CONFIG =======================
  const SUPABASE_URL = 'https://cdnjaoqkxztmdiaetwgh.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_6bfDWvU8DPWpzCS96XCQXg_jJc2AV5z';
  // ========================================================

  // Magic-link URLs sometimes arrive corrupted (extra encoding, or a stray
  // error=access_denied&error_code=otp_expired block glued in front of a still-valid
  // token) depending on the email client/provider. Rather than trust Supabase's
  // built-in URL parser (which gives up the moment it sees a leading error= param),
  // we take full manual control: search the raw URL for access_token/refresh_token
  // wherever they appear, and establish the session ourselves if found.
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { detectSessionInUrl: false }
  });

  async function recoverSessionFromUrl() {
    const href = window.location.href;
    const accessMatch = href.match(/access_token=([^&]+)/);
    const refreshMatch = href.match(/refresh_token=([^&]+)/);
    if (!accessMatch || !refreshMatch) return false;
    const { error } = await sb.auth.setSession({
      access_token: accessMatch[1],
      refresh_token: refreshMatch[1],
    });
    // Clean the messy hash out of the address bar either way
    history.replaceState(null, '', window.location.pathname + window.location.search);
    return !error;
  }

  const root = document.getElementById('root');

  let state = {
    session: null,
    workout: null,
    tasks: [],       // flat queue: {type:'strength', segment, movement} or {type:'wod', segment}
    taskIndex: 0,
    setNumber: 1,     // for strength tasks
    error: null,
    view: 'home',      // 'home' (the landing screen) or 'entry' (logging a workout)
    anyLogged: false,  // does the loaded workout have ANY results yet? (fresh vs. partly logged)
    loading: true,     // true until the first workout load finishes, so we don't flash an empty home
    onEntryDone: null, // where to go when a one-off entry finishes (e.g. back to Day Review)
    challenge: null,       // the challenge running right now, if any
    challengeTotal: 0,     // this athlete's counted total for it
    isAdmin: false,        // is this person a challenge organizer?
  };

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(iso) {
    const d = new Date(iso);
    return `${d.getMonth()+1}/${d.getDate()}/${String(d.getFullYear()).slice(-2)}`;
  }
  // For plain 'YYYY-MM-DD' date strings (workout_date), NOT full timestamps —
  // parses as a local date directly, avoiding the classic bug where
  // new Date('YYYY-MM-DD') is read as UTC midnight and can show the wrong day
  // in any timezone behind UTC (e.g. US Eastern).
  function parseDateOnly(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function fmtShortWeekday(dateStr) {
    const d = parseDateOnly(dateStr);
    return `${d.toLocaleDateString('en-US', { weekday: 'short' })} ${d.getMonth() + 1}/${d.getDate()}`;
  }
  function fmtFullDate(dateStr) {
    const d = parseDateOnly(dateStr);
    return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }
  // Today's date where YOU are, as YYYY-MM-DD. Not new Date().toISOString(): that is the UTC date,
  // which after about 8 PM Eastern is already tomorrow.
  function localDateStr(d) {
    d = d || new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function parseLeadingInt(text) {
    if (!text) return null;
    const m = String(text).match(/(\d+)/);
    return m ? parseInt(m[1], 10) : null;
  }
  function epley(weight, reps) {
    // A true 1-rep set IS the 1RM already — nothing to estimate. Only
    // extrapolate for multi-rep sets, where the formula actually applies.
    if (reps <= 1) return weight;
    return weight * (1 + reps / 30);
  }

  // Heuristic list of common bodyweight/no-load movements — no schema change
  // needed, and works retroactively on every movement already in the database.
  // Add more patterns here as new bodyweight movements show up in the programming.
  const BODYWEIGHT_PATTERNS = [
    /sit.?up/i, /push.?up/i, /pull.?up/i, /hspu|handstand.?push.?up/i,
    /air.?squat/i, /pistol/i, /squat.?jump/i, /broad.?jump/i, /box.?jump/i,
    /box.?step.?up/i, /step.?up/i, /lunge/i, /ab.?wheel/i,
    /burpee/i, /mountain.?climber/i, /bear.?crawl/i, /ring.?row/i,
    /toes.?to.?bar|t2b/i, /knees.?to.?elbows?|k2e/i, /muscle.?up/i,
    /ring.?dip/i, /\bdip\b/i, /jumping.?jack/i, /double.?under/i, /single.?under/i,
    /rope.?climb/i, /ghd/i,
  ];
  // Some bodyweight-pattern names (lunges, step-ups) can also appear as a loaded
  // variant (e.g. "Weighted Lunges", "Dumbbell Step Ups"). If the name explicitly
  // mentions an implement, always treat it as loaded regardless of the match above.
  const LOADED_OVERRIDE_PATTERNS = [
    /weighted/i, /dumbbell/i, /\bdb\b/i, /barbell/i, /kettlebell/i, /\bkb\b/i, /goblet/i,
  ];
  function isBodyweightMovement(name) {
    if (LOADED_OVERRIDE_PATTERNS.some((p) => p.test(name))) return false;
    return BODYWEIGHT_PATTERNS.some((p) => p.test(name));
  }

  // Cardio / monostructural work (bike, row, ski, run). Neither pounds nor reps
  // describes these, so they get their own entry mode: a duration plus optional
  // calories. Rowing/running are matched strictly so "Bent Over Row" or
  // "Ring Row" are never mistaken for the rower.
  const CARDIO_PATTERNS = [
    /\bbike(\s*erg)?\b/i,
    /\bski(\s*erg)?\b/i,
    /^\s*(calorie\s+|cal\s+|meter\s+)?(row|rower|rowing|run|running|jog|jogging|swim|swimming)(\s+erg)?\s*$/i,
  ];
  function isCardioMovement(name) {
    return CARDIO_PATTERNS.some((p) => p.test(name));
  }
  // "2 minutes" -> 120, "1:30" -> 90, "90 seconds" -> 90
  function parseDurationSeconds(text) {
    if (!text) return null;
    const t = String(text).toLowerCase();
    let m = t.match(/(\d+):(\d{2})/);
    if (m) return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
    m = t.match(/(\d+(?:\.\d+)?)\s*(?:min|minute)/);
    if (m) return Math.round(parseFloat(m[1]) * 60);
    m = t.match(/(\d+)\s*(?:sec|second)/);
    if (m) return parseInt(m[1], 10);
    return null;
  }
  function fmtDuration(totalSeconds) {
    if (totalSeconds == null) return null;
    const m = Math.floor(totalSeconds / 60), s = totalSeconds % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }
  // One readable line for a cardio round, e.g. "2:00 · 28 cal"
  function fmtCardioSet(row) {
    const parts = [];
    if (row.duration_seconds != null) parts.push(fmtDuration(row.duration_seconds));
    if (row.calories != null) parts.push(`${row.calories} cal`);
    return parts.length ? parts.join(' · ') : 'Completed';
  }

  // ---- WOD details -----------------------------------------------------
  // The site's page text ends with a share widget and a date ("Like / Loading… / September 23, 2026").
  function cleanPostText(raw) {
    if (!raw) return '';
    return String(raw)
      .replace(/\u00a0/g, ' ')
      .replace(/\n+\s*Like\s*\n+\s*Loading[\s\S]*$/i, '')
      .replace(/^[ \t]+|[ \t]+$/gm, '')          // stray spaces at the edges of lines
      .replace(/^(\d+)\s*\.\s*$/gm, '$1.')      // a lone "1 ." line becomes "1."
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }
  // Shows the WOD as written. Preference: the stored description (new days), else the
  // parsed movement list (older days). The full post is always one tap away, which is
  // what gives past days complete details without re-processing anything.
  function wodDetailsHtml(seg, movements, rawPostText) {
    let body = '';
    if (seg.description) {
      body = `<div class="wod-desc">${esc(seg.description)}</div>`;
    } else if (movements && movements.length) {
      body = `<div class="wod-desc">${movements.map(m => {
        const reps = m.prescribed_reps ? `${esc(m.prescribed_reps)} ` : '';
        const scheme = m.prescribed_scheme ? ` <span class="wod-dim">(${esc(m.prescribed_scheme)})</span>` : '';
        return `${reps}${esc(m.movements ? m.movements.name : '')}${scheme}`;
      }).join('<br>')}</div>`;
    }
    const full = cleanPostText(rawPostText);
    const fullBlock = full
      ? `<details class="wod-full"><summary>Full workout as posted</summary><div class="wod-desc">${esc(full)}</div></details>`
      : '';
    if (!body && !fullBlock) return '';
    return `<div class="wod-details">${body}${fullBlock}</div>`;
  }

  // ======================= DATA LOADING =======================
  async function loadWorkoutForDate(dateStr) {
    const { data: workouts, error: wErr } = await sb
      .from('workouts').select('*').lte('workout_date', dateStr)
      .order('workout_date', { ascending: false }).limit(1);
    if (wErr) { state.error = wErr.message; return; }
    if (!workouts || workouts.length === 0) { state.workout = null; state.tasks = []; state.anyLogged = false; return; }
    state.workout = workouts[0];

    const { data: segments, error: sErr } = await sb
      .from('segments').select('*').eq('workout_id', state.workout.id).eq('source', 'havoc')
      .order('segment_order');
    if (sErr) { state.error = sErr.message; return; }

    const tasks = [];
    for (const seg of segments) {
      if (seg.segment_type === 'strength') {
        const { data: movs } = await sb
          .from('segment_movements').select('*, movements(id, name)')
          .eq('segment_id', seg.id).order('movement_order');
        for (const m of (movs || [])) {
          tasks.push({ type: 'strength', segment: seg, segMovement: m, movement: m.movements });
        }
      } else if (seg.segment_type === 'wod') {
        const { data: wodMovs } = await sb
          .from('segment_movements').select('*, movements(id, name)')
          .eq('segment_id', seg.id).order('movement_order');
        tasks.push({ type: 'wod', segment: seg, movements: wodMovs || [] });
      }
    }
    state.tasks = tasks;

    // Figure out exactly where to resume: skip past any strength movement whose
    // sets are all already logged, or any WOD already scored, and land on the
    // first genuinely incomplete task — so closing the app mid-workout and
    // reopening it later picks up right where you left off, not from scratch.
    const wodSegIds = tasks.filter(t => t.type === 'wod').map(t => t.segment.id);
    const strengthSegIds = tasks.filter(t => t.type === 'strength').map(t => t.segment.id);

    const loggedWodSegIds = new Set();
    if (wodSegIds.length) {
      const { data } = await sb.from('wod_results').select('segment_id').in('segment_id', wodSegIds);
      (data || []).forEach(r => loggedWodSegIds.add(r.segment_id));
    }

    const strengthMaxSet = {}; // key: `${segment_id}_${movement_id}` -> highest set_number logged so far
    if (strengthSegIds.length) {
      const { data } = await sb.from('strength_results').select('segment_id, movement_id, set_number').in('segment_id', strengthSegIds);
      (data || []).forEach(r => {
        const key = `${r.segment_id}_${r.movement_id}`;
        strengthMaxSet[key] = Math.max(strengthMaxSet[key] || 0, r.set_number || 0);
      });
    }

    let resumeIndex = tasks.length; // default: everything already done
    let resumeSetNumber = 1;
    for (let i = 0; i < tasks.length; i++) {
      const t = tasks[i];
      if (t.type === 'wod') {
        if (!loggedWodSegIds.has(t.segment.id)) { resumeIndex = i; resumeSetNumber = 1; break; }
      } else {
        const key = `${t.segment.id}_${t.movement.id}`;
        const loggedCount = strengthMaxSet[key] || 0;
        const prescribedSets = t.segMovement.prescribed_sets || 1;
        if (loggedCount < prescribedSets) { resumeIndex = i; resumeSetNumber = loggedCount + 1; break; }
      }
    }
    state.taskIndex = resumeIndex;
    state.setNumber = resumeSetNumber;
    state.anyLogged = loggedWodSegIds.size > 0 || Object.keys(strengthMaxSet).length > 0;
  }

  async function loadMovementHistory(movementId) {
    const { data, error } = await sb
      .from('strength_results').select('reps_completed, weight_lbs, logged_at')
      .eq('movement_id', movementId)
      .not('segment_id', 'is', null) // manually entered PRs have no workout; keep them out of "last session" and the pre-filled weight
      .order('logged_at', { ascending: false }).limit(5);
    if (error) { state.error = error.message; return { recent: [], bestActual: null, bestCalc: null, bestReps: null }; }
    const recent = data || [];
    // Two separate records, deliberately not blended:
    //   bestActual = heaviest TRUE single (reps_completed === 1) — a lift you actually did
    //   bestCalc   = highest Epley estimate from multi-rep sets — an extrapolation
    let bestActual = null, bestCalc = null, bestReps = null;
    const { data: allRows } = await sb
      .from('strength_results').select('reps_completed, weight_lbs')
      .eq('movement_id', movementId).not('reps_completed', 'is', null);
    for (const row of (allRows || [])) {
      if (row.reps_completed && (bestReps === null || row.reps_completed > bestReps)) {
        bestReps = row.reps_completed;
      }
      if (!row.weight_lbs || !row.reps_completed) continue;
      if (row.reps_completed === 1) {
        if (bestActual === null || row.weight_lbs > bestActual) bestActual = row.weight_lbs;
      } else {
        const est = epley(row.weight_lbs, row.reps_completed);
        if (bestCalc === null || est > bestCalc) bestCalc = est;
      }
    }
    return { recent, bestActual, bestCalc, bestReps };
  }

  // ======================= WRITES =======================
  async function logStrengthSet(segMovementId, movementId, setNumber, reps, weight, notes) {
    const { error } = await sb.from('strength_results').upsert({
      segment_id: state.tasks[state.taskIndex].segment.id,
      movement_id: movementId,
      set_number: setNumber,
      reps_completed: reps,
      weight_lbs: weight,
      notes: notes || null,
    }, { onConflict: 'user_id,segment_id,movement_id,set_number' });
    if (error) throw error;
  }

  // A cardio round: no pounds, no reps — just how long and (optionally) how many calories.
  async function logCardioRound(movementId, setNumber, durationSeconds, calories, notes) {
    const { error } = await sb.from('strength_results').upsert({
      segment_id: state.tasks[state.taskIndex].segment.id,
      movement_id: movementId,
      set_number: setNumber,
      reps_completed: null,
      weight_lbs: null,
      duration_seconds: durationSeconds,
      calories: calories,
      notes: notes || null,
    }, { onConflict: 'user_id,segment_id,movement_id,set_number' });
    if (error) throw error;
  }

  async function logWodResult(segmentId, payload) {
    const { error } = await sb.from('wod_results')
      .upsert({ segment_id: segmentId, ...payload }, { onConflict: 'user_id,segment_id' });
    if (error) throw error;

  // Custom (non-Havoc) workouts: used for days like Saturday Hyrox that CF Havoc
  // never posts, or any day you want to log something other than the class WOD.
  async function getOrCreateWorkout(dateStr) {
    const { data: existing, error: findErr } = await sb
      .from('workouts').select('*').eq('workout_date', dateStr).limit(1);
    if (findErr) throw findErr;
    if (existing && existing.length) return existing[0];

    const { data: created, error: insErr } = await sb.from('workouts').insert({
      workout_date: dateStr,
      source_title: 'Custom entry (no class WOD posted)',
      raw_text: 'No Havoc class WOD was scraped for this date — logged as a custom workout.',
    }).select().single();
    if (insErr) throw insErr;
    return created;
  }

  async function logCustomWorkout({ dateStr, customType, title, timeSeconds, notes }) {
    const workout = await getOrCreateWorkout(dateStr);
    const userId = state.session.user.id;

    const { data: segment, error: segErr } = await sb.from('segments').insert({
      workout_id: workout.id,
      segment_order: 1,
      segment_type: 'wod',
      title,
      structure_type: 'for_time',
      raw_text: title,
      score_type: 'time',
      source: 'custom',
      custom_type: customType,
      user_id: userId,
    }).select().single();
    if (segErr) throw segErr;

    const { error: resErr } = await sb.from('wod_results').insert({
      segment_id: segment.id,
      score_type: 'time',
      time_seconds: timeSeconds,
      notes: notes || null,
    });
    if (resErr) throw resErr;

    return workout;
  }

  function wodScoreLabel(r) {
    if (r.score_type === 'time') {
      if (r.time_seconds == null) return '—';
      const m = Math.floor(r.time_seconds / 60), s = r.time_seconds % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }
    if (r.score_type === 'rounds_reps') return `${r.rounds_completed ?? 0} rds + ${r.extra_reps ?? 0}`;
    if (r.score_type === 'reps') return `${r.total_reps ?? 0} reps`;
    if (r.score_type === 'calories') return `${r.calories ?? 0} cal`;
    return r.notes || 'Logged';
  }

  // ======================= RENDER: DAY REVIEW =======================
  // Shows exactly what was logged for a given day, editable set-by-set —
  // distinct from the entry flow, which is for logging new sets forward.
  // onBack: where the back arrow goes. Defaults to the day picker; the home screen passes
  // its own so "Review / Edit Results" returns home.
  async function renderDayReview(dateStr, onBack) {
    const goBack = onBack || (() => renderDayPicker());
    root.innerHTML = `${topBarHtml(true)}<div class="center-msg">Loading…</div>`;

    const { data: workouts } = await sb.from('workouts').select('*').eq('workout_date', dateStr).limit(1);
    if (!workouts || !workouts.length) {
      root.innerHTML = `${topBarHtml(true)}<div class="center-msg">No workout found for ${esc(dateStr)}.</div>`;
      wireTopBar(goBack);
      return;
    }
    const workout = workouts[0];

    const { data: segments } = await sb
      .from('segments').select('*').eq('workout_id', workout.id)
      .in('segment_type', ['strength', 'wod']).order('segment_order');

    const strengthSegs = (segments || []).filter(s => s.segment_type === 'strength');
    const wodSegs = (segments || []).filter(s => s.segment_type === 'wod');

    const movementBlocks = [];
    for (const seg of strengthSegs) {
      const { data: movs } = await sb
        .from('segment_movements').select('*, movements(id, name)')
        .eq('segment_id', seg.id).order('movement_order');
      for (const m of (movs || [])) {
        movementBlocks.push({ segment: seg, segMovement: m, movement: m.movements, sets: [] });
      }
    }
    const strengthSegIds = strengthSegs.map(s => s.id);
    if (strengthSegIds.length) {
      const { data: allSets } = await sb
        .from('strength_results').select('*').in('segment_id', strengthSegIds).order('set_number');
      (allSets || []).forEach(row => {
        const block = movementBlocks.find(b => b.segment.id === row.segment_id && b.movement.id === row.movement_id);
        if (block) block.sets.push(row);
      });
    }

    const wodBlocks = [];
    for (const seg of wodSegs) {
      const { data: results } = await sb.from('wod_results').select('*').eq('segment_id', seg.id);
      const { data: wodMovs } = await sb
        .from('segment_movements').select('*, movements(id, name)')
        .eq('segment_id', seg.id).order('movement_order');
      wodBlocks.push({ segment: seg, result: (results && results[0]) || null, movements: wodMovs || [] });
    }

    let editingKey = null;   // e.g. "movementId_3" for a set, or "wod_<segmentId>"
    let addingSetFor = null; // movementId currently showing an add-set form

    function draw() {
      let html = `
        ${topBarHtml(true)}
        <div class="page-title" style="font-size:32px;">${esc(dateStr)}</div>
        <div class="scheme" style="margin-bottom:18px;">${esc(workout.source_title || '')}</div>
      `;
      if (state.error) html += `<div class="error-banner">${esc(state.error)}</div>`;

      movementBlocks.forEach(block => {
        const isBW = isBodyweightMovement(block.movement.name);
        const isCardio = isCardioMovement(block.movement.name);
        const prescribedSets = block.segMovement.prescribed_sets || 1;
        html += `<div class="review-block"><div class="review-title">${esc(block.movement.name)}</div>`;
        block.sets.forEach(s => {
          const key = `${block.movement.id}_${s.set_number}`;
          if (editingKey === key) {
            const editFields = isCardio
              ? `<div class="score-field"><label>Minutes</label><input type="number" id="editMin" value="${Math.floor((s.duration_seconds || 0) / 60)}" min="0"></div>
                 <div class="score-field"><label>Seconds</label><input type="number" id="editSec" value="${(s.duration_seconds || 0) % 60}" min="0" max="59"></div>
                 <div class="score-field"><label>Cal</label><input type="number" id="editCal" value="${s.calories ?? ''}" min="0" placeholder="—"></div>`
              : `<div class="score-field"><label>Reps</label><input type="number" id="editReps" value="${s.reps_completed ?? ''}" min="0"></div>
                 ${!isBW ? `<div class="score-field"><label>Weight (lb)</label><input type="number" id="editWeight" value="${s.weight_lbs ?? ''}" min="0"></div>` : ''}`;
            html += `
              <div class="review-edit-form">
                <div class="score-row">
                  ${editFields}
                </div>
                <div class="notes-field"><label>Notes</label><input type="text" id="editNotes" value="${esc(s.notes || '')}"></div>
                <div style="display:flex;gap:8px;margin-top:10px;">
                  <button class="log-btn" id="saveSetBtn" style="margin-top:0;flex:1;">Save</button>
                  <button class="secondary-btn" id="cancelSetBtn" style="margin-top:0;flex:1;">Cancel</button>
                </div>
              </div>`;
          } else {
            const valText = isCardio
              ? fmtCardioSet(s)
              : isBW
                ? `${s.reps_completed ?? '?'} reps${s.weight_lbs ? ` @ ${s.weight_lbs} lb` : ''}`
                : `${s.reps_completed ?? '?'} reps @ ${s.weight_lbs ?? '?'} lb`;
            html += `
              <div class="review-row">
                <span class="review-set-label">Set ${s.set_number}</span>
                <span class="review-set-val">${valText}${s.notes ? `<span class="review-note">${esc(s.notes)}</span>` : ''}</span>
                <button class="nav-link-btn" data-edit-set="${key}" type="button">Edit</button>
              </div>`;
          }
        });
        if (block.sets.length < prescribedSets) {
          const nextSet = block.sets.length + 1;
          if (addingSetFor === block.movement.id) {
            const addSeconds = isCardio
              ? (parseDurationSeconds(block.segMovement.prescribed_reps) || parseDurationSeconds(block.segMovement.prescribed_scheme) || 0)
              : 0;
            const addFields = isCardio
              ? `<div class="score-field"><label>Minutes</label><input type="number" id="addMin" value="${Math.floor(addSeconds / 60)}" min="0"></div>
                 <div class="score-field"><label>Seconds</label><input type="number" id="addSec" value="${addSeconds % 60}" min="0" max="59"></div>
                 <div class="score-field"><label>Cal</label><input type="number" id="addCal" value="" min="0" placeholder="—"></div>`
              : `<div class="score-field"><label>Reps</label><input type="number" id="addReps" value="${block.segMovement.prescribed_reps ? parseInt(block.segMovement.prescribed_reps, 10) || '' : ''}" min="0"></div>
                 ${!isBW ? `<div class="score-field"><label>Weight (lb)</label><input type="number" id="addWeight" value="0" min="0"></div>` : ''}`;
            html += `
              <div class="review-edit-form">
                <div class="score-row">
                  ${addFields}
                </div>
                <div style="display:flex;gap:8px;margin-top:10px;">
                  <button class="log-btn" id="saveAddBtn" style="margin-top:0;flex:1;">Save Set ${nextSet}</button>
                  <button class="secondary-btn" id="cancelAddBtn" style="margin-top:0;flex:1;">Cancel</button>
                </div>
              </div>`;
          } else {
            html += `<button class="nav-link-btn" data-add-set="${block.movement.id}" type="button" style="margin-top:6px;">+ Add set ${nextSet} (${prescribedSets - block.sets.length} remaining)</button>`;
          }
        }
        html += `</div>`;
      });

      wodBlocks.forEach(wb => {
        const key = `wod_${wb.segment.id}`;
        html += `<div class="review-block"><div class="review-title">${esc(wb.segment.wod_name || wb.segment.title || 'WOD')}</div>`;
        if (wb.segment.source !== 'custom') {
          html += wodDetailsHtml(wb.segment, wb.movements, workout.raw_text);
        }
        if (!wb.result) {
          html += `<button class="nav-link-btn" data-log-wod="${wb.segment.id}" type="button">+ Log this WOD</button>`;
        } else if (editingKey === key) {
          const st = wb.result.score_type;
          let fieldsHtml = '';
          if (st === 'time') {
            const m = Math.floor((wb.result.time_seconds || 0) / 60), s = (wb.result.time_seconds || 0) % 60;
            fieldsHtml = `<div class="score-row">
              <div class="score-field"><label>Minutes</label><input type="number" id="editMin" value="${m}" min="0"></div>
              <div class="score-field"><label>Seconds</label><input type="number" id="editSec" value="${s}" min="0" max="59"></div>
            </div>`;
          } else if (st === 'rounds_reps') {
            fieldsHtml = `<div class="score-row">
              <div class="score-field"><label>Rounds</label><input type="number" id="editRounds" value="${wb.result.rounds_completed ?? 0}" min="0"></div>
              <div class="score-field"><label>+ Reps</label><input type="number" id="editExtra" value="${wb.result.extra_reps ?? 0}" min="0"></div>
            </div>`;
          } else if (st === 'reps') {
            fieldsHtml = `<div class="score-row"><div class="score-field"><label>Total reps</label><input type="number" id="editTotalReps" value="${wb.result.total_reps ?? 0}" min="0"></div></div>`;
          } else if (st === 'calories') {
            fieldsHtml = `<div class="score-row"><div class="score-field"><label>Calories</label><input type="number" id="editCals" value="${wb.result.calories ?? 0}" min="0"></div></div>`;
          }
          html += `
            <div class="review-edit-form">
              ${fieldsHtml}
              <div class="notes-field"><label>Notes</label><input type="text" id="editWodNotes" value="${esc(wb.result.notes || '')}"></div>
              <div style="display:flex;gap:8px;margin-top:10px;">
                <button class="log-btn" id="saveWodBtn" style="margin-top:0;flex:1;">Save</button>
                <button class="secondary-btn" id="cancelWodBtn" style="margin-top:0;flex:1;">Cancel</button>
              </div>
            </div>`;
        } else {
          html += `
            <div class="review-row">
              <span class="review-set-label">${wb.result.rx_or_scaled ? wb.result.rx_or_scaled : 'Score'}</span>
              <span class="review-set-val">${esc(wodScoreLabel(wb.result))}${wb.result.notes ? `<span class="review-note">${esc(wb.result.notes)}</span>` : ''}</span>
              <button class="nav-link-btn" data-edit-wod="${key}" type="button">Edit</button>
            </div>`;
        }
        html += `</div>`;
      });

      if (!movementBlocks.length && !wodBlocks.length) {
        html += `<div class="center-msg" style="margin-top:20px;">Nothing to review for this day.</div>`;
      }

      root.innerHTML = html;
      wireTopBar(goBack);

      root.querySelectorAll('[data-edit-set]').forEach(btn => {
        btn.onclick = () => { editingKey = btn.dataset.editSet; draw(); };
      });
      root.querySelectorAll('[data-add-set]').forEach(btn => {
        btn.onclick = () => { addingSetFor = Number(btn.dataset.addSet); draw(); };
      });
      root.querySelectorAll('[data-edit-wod]').forEach(btn => {
        btn.onclick = () => { editingKey = btn.dataset.editWod; draw(); };
      });
      root.querySelectorAll('[data-log-wod]').forEach(btn => {
        btn.onclick = async () => {
          // Route into the normal single-task WOD entry flow for just this WOD
          const seg = wodSegs.find(s => s.id === Number(btn.dataset.logWod));
          const wb = wodBlocks.find(b => b.segment.id === seg.id);
          state.workout = workout;
          state.tasks = [{ type: 'wod', segment: seg, movements: (wb && wb.movements) || [] }];
          state.taskIndex = 0;
          state.view = 'entry';
          state.onEntryDone = () => renderDayReview(dateStr, onBack); // finish -> back to this review
          renderWod(state.tasks[0]);
        };
      });

      const cancelSetBtn = document.getElementById('cancelSetBtn');
      if (cancelSetBtn) cancelSetBtn.onclick = () => { editingKey = null; draw(); };
      const cancelAddBtn = document.getElementById('cancelAddBtn');
      if (cancelAddBtn) cancelAddBtn.onclick = () => { addingSetFor = null; draw(); };
      const cancelWodBtn = document.getElementById('cancelWodBtn');
      if (cancelWodBtn) cancelWodBtn.onclick = () => { editingKey = null; draw(); };

      const saveSetBtn = document.getElementById('saveSetBtn');
      if (saveSetBtn) saveSetBtn.onclick = async () => {
        saveSetBtn.disabled = true;
        const [movementId, setNumberStr] = editingKey.split('_');
        const block = movementBlocks.find(b => String(b.movement.id) === movementId);
        const setRow = block.sets.find(s => String(s.set_number) === setNumberStr);

        // Cardio round: duration + calories instead of reps + weight
        if (document.getElementById('editMin')) {
          const mins = parseInt(document.getElementById('editMin').value || '0', 10) || 0;
          const secs = parseInt(document.getElementById('editSec').value || '0', 10) || 0;
          const total = mins * 60 + secs;
          const calRaw = document.getElementById('editCal').value.trim();
          const cal = calRaw === '' ? null : parseInt(calRaw, 10);
          const noteVal = document.getElementById('editNotes').value.trim() || null;
          const cardioPayload = {
            duration_seconds: total > 0 ? total : null,
            calories: (cal == null || isNaN(cal)) ? null : cal,
            reps_completed: null,   // clears any stray pounds/reps from before this was a cardio entry
            weight_lbs: null,
            notes: noteVal,
          };
          try {
            const { error } = await sb.from('strength_results').update(cardioPayload).eq('id', setRow.id);
            if (error) throw error;
            Object.assign(setRow, cardioPayload);
            state.error = null;
            editingKey = null;
            draw();
          } catch (e) {
            state.error = e.message;
            draw();
          }
          return;
        }

        const repsEl = document.getElementById('editReps');
        const weightEl = document.getElementById('editWeight');
        const notesEl = document.getElementById('editNotes');
        const reps = parseInt(repsEl.value, 10);
        const weight = weightEl ? parseInt(weightEl.value, 10) : null;
        try {
          const { error } = await sb.from('strength_results').update({
            reps_completed: isNaN(reps) ? setRow.reps_completed : reps,
            weight_lbs: weightEl ? (isNaN(weight) ? null : weight) : setRow.weight_lbs,
            notes: notesEl.value.trim() || null,
          }).eq('id', setRow.id);
          if (error) throw error;
          setRow.reps_completed = isNaN(reps) ? setRow.reps_completed : reps;
          if (weightEl) setRow.weight_lbs = isNaN(weight) ? null : weight;
          setRow.notes = notesEl.value.trim() || null;
          state.error = null;
          editingKey = null;
          draw();
        } catch (e) {
          state.error = e.message;
          draw();
        }
      };

      const saveAddBtn = document.getElementById('saveAddBtn');
      if (saveAddBtn) saveAddBtn.onclick = async () => {
        saveAddBtn.disabled = true;
        const block = movementBlocks.find(b => b.movement.id === addingSetFor);
        const nextSet = block.sets.length + 1;

        // Cardio round: duration + calories instead of reps + weight
        if (document.getElementById('addMin')) {
          const mins = parseInt(document.getElementById('addMin').value || '0', 10) || 0;
          const secs = parseInt(document.getElementById('addSec').value || '0', 10) || 0;
          const total = mins * 60 + secs;
          const calRaw = document.getElementById('addCal').value.trim();
          const cal = calRaw === '' ? null : parseInt(calRaw, 10);
          try {
            const { data, error } = await sb.from('strength_results').insert({
              segment_id: block.segment.id,
              movement_id: block.movement.id,
              set_number: nextSet,
              duration_seconds: total > 0 ? total : null,
              calories: (cal == null || isNaN(cal)) ? null : cal,
            }).select().single();
            if (error) throw error;
            block.sets.push(data);
            state.error = null;
            addingSetFor = null;
            draw();
          } catch (e) {
            state.error = e.message;
            draw();
          }
          return;
        }

        const repsEl = document.getElementById('addReps');
        const weightEl = document.getElementById('addWeight');
        const reps = parseInt(repsEl.value, 10);
        const weight = weightEl ? parseInt(weightEl.value, 10) : null;
        try {
          const { data, error } = await sb.from('strength_results').insert({
            segment_id: block.segment.id,
            movement_id: block.movement.id,
            set_number: nextSet,
            reps_completed: isNaN(reps) ? null : reps,
            weight_lbs: weightEl ? (isNaN(weight) ? null : weight) : null,
          }).select().single();
          if (error) throw error;
          block.sets.push(data);
          state.error = null;
          addingSetFor = null;
          draw();
        } catch (e) {
          state.error = e.message;
          draw();
        }
      };

      const saveWodBtn = document.getElementById('saveWodBtn');
      if (saveWodBtn) saveWodBtn.onclick = async () => {
        saveWodBtn.disabled = true;
        const segId = editingKey.replace('wod_', '');
        const wb = wodBlocks.find(w => `wod_${w.segment.id}` === editingKey);
        const payload = { notes: document.getElementById('editWodNotes').value.trim() || null };
        const st = wb.result.score_type;
        if (st === 'time') {
          const m = parseInt(document.getElementById('editMin').value || '0', 10);
          const s = parseInt(document.getElementById('editSec').value || '0', 10);
          payload.time_seconds = m * 60 + s;
        } else if (st === 'rounds_reps') {
          payload.rounds_completed = parseInt(document.getElementById('editRounds').value || '0', 10);
          payload.extra_reps = parseInt(document.getElementById('editExtra').value || '0', 10);
        } else if (st === 'reps') {
          payload.total_reps = parseInt(document.getElementById('editTotalReps').value || '0', 10);
        } else if (st === 'calories') {
          payload.calories = parseInt(document.getElementById('editCals').value || '0', 10);
        }
        try {
          const { error } = await sb.from('wod_results').update(payload).eq('id', wb.result.id);
          if (error) throw error;
          Object.assign(wb.result, payload);
          state.error = null;
          editingKey = null;
          draw();
        } catch (e) {
          state.error = e.message;
          draw();
        }
      };
    }
    draw();
  }
