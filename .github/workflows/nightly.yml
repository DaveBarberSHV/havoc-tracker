name: Nightly WOD Ingest

on:
  schedule:
    # Cron is UTC only and does NOT observe daylight saving, so we cover both
    # EDT and EST year-round with separate lines rather than trying to adjust
    # the schedule twice a year. Running every day (not just Mon-Fri) is
    # deliberate: the script safely no-ops when there's nothing new, and this
    # avoids any day-of-week mapping mistakes (an earlier version of this file
    # had a gap that missed checking for Monday's post on Sunday evening).
    #
    # Evening checks, aimed at ~9:30pm ET (Havoc's ~9:10pm posting deadline):
    - cron: '30 1 * * *'   # 9:30pm EDT
    - cron: '30 2 * * *'   # 9:30pm EST
    # Morning backup, aimed at ~6am ET — catches a late post or a delayed
    # GitHub Actions run (scheduled workflows can run late, sometimes by
    # hours, especially soon after being set up) before you head to the gym:
    - cron: '0 10 * * *'   # 6:00am EDT
    - cron: '0 11 * * *'   # 6:00am EST
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run nightly ingest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/nightly_ingest.py
