<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Havoc Tracker — Movement History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #17181A; --panel: #1F2124; --panel-2: #26282C; --chalk: #F2EFE9; --chalk-dim: #A9A7A2;
    --accent: #C1443B; --accent-dim: #7A2C27; --good: #7FA66B; --radius: 14px; box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--chalk);
    font-family: 'Barlow Condensed', ui-sans-serif, system-ui, sans-serif; touch-action: manipulation; }
  #root { max-width: 560px; margin: 0 auto; min-height: 100%;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(32px + env(safe-area-inset-bottom, 0px)); }
  h1, h2, h3, p { margin: 0; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; min-height: 40px; }
  .hamburger-btn {
    background: none; border: none; color: var(--chalk); font-size: 28px; padding: 4px 10px 4px 0;
    line-height: 1; touch-action: manipulation;
  }
  .back-btn {
    background: none; border: none; color: var(--chalk); font-size: 20px; padding: 6px 4px;
    font-family: 'Barlow Condensed', sans-serif; touch-action: manipulation;
  }
  .menu-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .menu-overlay.open { opacity: 1; pointer-events: auto; }
  .menu-panel {
    position: fixed; top: 0; left: 0; right: 0; background: var(--panel); z-index: 101;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 24px; border-radius: 0 0 18px 18px;
    transform: translateY(-105%); transition: transform 0.25s ease; max-width: 480px; margin: 0 auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .menu-panel.open { transform: translateY(0); }
  .menu-item {
    display: block; width: 100%; text-align: left; background: var(--panel-2); color: var(--chalk);
    border: none; border-radius: 10px; padding: 18px 18px; font-size: 24px; font-weight: 600;
    font-family: 'Barlow Condensed', sans-serif; margin-bottom: 10px; text-decoration: none; touch-action: manipulation;
  }
  .menu-item:active { background: var(--accent-dim); }
  .menu-close-btn {
    display: block; width: 100%; text-align: center; background: none; border: none;
    color: var(--chalk-dim); font-size: 19px; padding: 10px; margin-top: 4px; font-family: 'Barlow Condensed', sans-serif;
  }
  .page-title { font-size: 38px; font-weight: 700; margin: 6px 0 2px; }
  .sub { color: var(--chalk-dim); font-size: 19px; margin-bottom: 18px; }

  .search-input {
    width: 100%; padding: 14px 16px; border-radius: 10px; border: 2px solid var(--panel-2);
    background: var(--panel); color: var(--chalk); font-size: 19px; font-family: 'Barlow Condensed', sans-serif;
    margin-bottom: 14px;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }

  .movement-row {
    width: 100%; background: var(--panel); border: none; border-radius: 10px; padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    color: var(--chalk); font-family: 'Barlow Condensed', sans-serif; text-align: left;
  }
  .movement-row:active { background: var(--panel-2); }
  .movement-row .mv-name { font-size: 21px; font-weight: 600; }
  .movement-row .mv-count { color: var(--chalk-dim); font-size: 16px; }
  .form-label { display: block; color: var(--chalk-dim); font-size: 18px; margin-bottom: 6px; }
  .form-input {
    width: 100%; padding: 14px 16px; border-radius: 10px; border: 2px solid var(--panel-2);
    background: var(--panel); color: var(--chalk); font-size: 22px; font-family: 'Barlow Condensed', sans-serif;
  }
  .form-input:focus { outline: none; border-color: var(--accent); }
  .score-row { display: flex; gap: 12px; width: 100%; }
  .score-field { flex: 1; }
  .score-field label { display: block; color: var(--chalk-dim); font-size: 18px; margin-bottom: 6px; }
  .score-field input {
    width: 100%; padding: 14px; border-radius: 10px; border: 2px solid var(--panel-2); background: var(--panel);
    color: var(--chalk); font-size: 28px; font-family: 'JetBrains Mono', monospace; text-align: center;
  }
  .score-field input:focus { outline: none; border-color: var(--accent); }
  .flash-ok { background: #2c4a2c; color: var(--chalk); padding: 12px 16px; border-radius: 10px; font-size: 19px; margin-bottom: 14px; }
  .pr-board-btn { background: var(--accent); margin-bottom: 14px; }
  .pr-board-btn:active { background: var(--accent-dim); }
  .pr-row { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    background: var(--panel); border-radius: 10px; padding: 14px 16px; margin-bottom: 8px; }
  .pr-row .pr-name { font-size: 21px; font-weight: 600; }
  .pr-row .pr-vals { text-align: right; flex-shrink: 0; }
  .pr-row .pr-main { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pr-row .pr-main.none { color: var(--chalk-dim); font-size: 20px; }
  .pr-row .pr-sub { color: var(--chalk-dim); font-size: 15px; }
  .section-label { color: var(--chalk-dim); font-size: 16px; text-transform: uppercase; letter-spacing: 0.05em;
    margin: 16px 0 8px; font-weight: 600; }

  .best-card {
    background: var(--accent); color: var(--chalk); border-radius: var(--radius); padding: 18px 20px;
    margin-bottom: 18px;
  }
  .best-card .best-label { font-size: 17px; opacity: 0.9; margin-bottom: 2px; }
  .best-card .best-value { font-family: 'JetBrains Mono', monospace; font-size: 34px; font-weight: 700; }
  .best-card .best-sub { font-size: 16px; opacity: 0.9; margin-top: 2px; }

  .chart-card { background: var(--panel); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; }
  .chart-card svg { width: 100%; height: auto; display: block; }

  .session-row {
    display: flex; justify-content: space-between; align-items: baseline; padding: 12px 4px;
    border-bottom: 1px solid var(--panel-2); font-size: 20px;
  }
  .session-row .s-date { color: var(--chalk-dim); font-size: 17px; }
  .session-row .s-val { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .session-row .s-pr { color: var(--accent); font-size: 15px; font-weight: 700; margin-left: 6px; }
  .session-row .s-pr.s-est { color: var(--chalk-dim); }
  .best-card.est { background: var(--panel); border: 2px solid var(--accent); }
  .session-row .s-notes { display: block; color: var(--chalk-dim); font-size: 15px; margin-top: 2px; font-style: italic; }

  .center-msg { text-align: center; color: var(--chalk-dim); font-size: 22px; margin-top: 60px; line-height: 1.5; }
  .error-banner { background: var(--accent-dim); color: var(--chalk); padding: 14px 16px; border-radius: 10px; font-size: 18px; margin-bottom: 16px; }
</style>
</head>
<body>
<div id="root"><div class="center-msg">Loading…</div></div>

<script>
  // ======================= CONFIG =======================
  const SUPABASE_URL = 'https://cdnjaoqkxztmdiaetwgh.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_6bfDWvU8DPWpzCS96XCQXg_jJc2AV5z';
  // ========================================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const root = document.getElementById('root');

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function epley(weight, reps) {
    // A true 1-rep set IS the 1RM already — nothing to estimate. Only
    // extrapolate for multi-rep sets, where the formula actually applies.
    if (reps <= 1) return weight;
    return weight * (1 + reps / 30);
  }
  function fmtDate(iso) {
    const d = new Date(iso);
    return `${d.getMonth()+1}/${d.getDate()}/${String(d.getFullYear()).slice(-2)}`;
  }
  function fmtTime(totalSeconds) {
    if (totalSeconds == null) return '—';
    const m = Math.floor(totalSeconds / 60), s = totalSeconds % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  // Same bodyweight detection as the main app, so history correctly labels
  // each movement's chart/units the same way the entry screen does.
  const BODYWEIGHT_PATTERNS = [
    /sit.?up/i, /push.?up/i, /pull.?up/i, /hspu|handstand.?push.?up/i,
    /air.?squat/i, /pistol/i, /squat.?jump/i, /broad.?jump/i, /box.?jump/i,
    /box.?step.?up/i, /step.?up/i, /lunge/i, /ab.?wheel/i,
    /burpee/i, /mountain.?climber/i, /bear.?crawl/i, /ring.?row/i,
    /toes.?to.?bar|t2b/i, /knees.?to.?elbows?|k2e/i, /muscle.?up/i,
    /ring.?dip/i, /\bdip\b/i, /jumping.?jack/i, /double.?under/i, /single.?under/i,
    /rope.?climb/i, /ghd/i,
  ];
  const LOADED_OVERRIDE_PATTERNS = [
    /weighted/i, /dumbbell/i, /\bdb\b/i, /barbell/i, /kettlebell/i, /\bkb\b/i, /goblet/i,
  ];
  function isBodyweightMovement(name) {
    if (LOADED_OVERRIDE_PATTERNS.some((p) => p.test(name))) return false;
    return BODYWEIGHT_PATTERNS.some((p) => p.test(name));
  }

  function topBarHtml(showBack) {
    return `
      <div class="top-bar">
        <button class="hamburger-btn" id="menuBtn" type="button" aria-label="Menu">☰</button>
        ${showBack ? `<button class="back-btn" id="topBackBtn" type="button">← Back</button>` : ''}
      </div>
      <div class="menu-overlay" id="menuOverlay"></div>
      <div class="menu-panel" id="menuPanel">
        <a class="menu-item" href="index.html">Today</a>
        <a class="menu-item" href="summary.html">This Week</a>
        <a class="menu-item" href="history.html">Movement History</a>
        <a class="menu-item" href="index.html?action=pickday">Pick a Day</a>
        <a class="menu-item" href="index.html?action=logcustom">Log Custom Workout</a>
        <button class="menu-item" id="menuSignOut" type="button">Sign Out</button>
        <button class="menu-close-btn" id="menuCloseBtn" type="button">Close</button>
      </div>`;
  }

  function wireTopBar(onBack) {
    const menuBtn = document.getElementById('menuBtn');
    const overlay = document.getElementById('menuOverlay');
    const panel = document.getElementById('menuPanel');
    const closeBtn = document.getElementById('menuCloseBtn');
    const openMenu = () => { overlay.classList.add('open'); panel.classList.add('open'); };
    const closeMenu = () => { overlay.classList.remove('open'); panel.classList.remove('open'); };
    menuBtn.onclick = openMenu;
    overlay.onclick = closeMenu;
    closeBtn.onclick = closeMenu;
    document.getElementById('menuSignOut').onclick = async () => {
      closeMenu(); await sb.auth.signOut(); window.location.href = 'index.html';
    };
    const backBtn = document.getElementById('topBackBtn');
    if (backBtn && onBack) backBtn.onclick = onBack;
  }

  // ======================= SVG LINE CHART =======================
  // Simple hand-rolled chart, no library needed for something this small.
  // Points are plotted at equal horizontal spacing (by session order), not
  // true calendar-date spacing — easier to read when sessions are irregular.
  function buildLineChartSvg(values, opts) {
    opts = opts || {};
    const W = 520, H = 200, padL = 46, padR = 16, padT = 16, padB = 28;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = (max - min) || 1;
    const n = values.length;
    const xFor = (i) => n <= 1 ? padL + innerW / 2 : padL + (innerW * i) / (n - 1);
    const yFor = (v) => padT + innerH - ((v - min) / range) * innerH;

    const points = values.map((v, i) => `${xFor(i)},${yFor(v)}`).join(' ');
    const circles = values.map((v, i) =>
      `<circle cx="${xFor(i)}" cy="${yFor(v)}" r="4" fill="${opts.color || '#C1443B'}" />`
    ).join('');
    const yMaxLabel = Math.round(max);
    const yMinLabel = Math.round(min);

    return `
      <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + innerH}" stroke="#3A3C40" stroke-width="1" />
        <line x1="${padL}" y1="${padT + innerH}" x2="${padL + innerW}" y2="${padT + innerH}" stroke="#3A3C40" stroke-width="1" />
        <text x="${padL - 8}" y="${padT + 4}" text-anchor="end" fill="#A9A7A2" font-size="13" font-family="JetBrains Mono, monospace">${yMaxLabel}</text>
        <text x="${padL - 8}" y="${padT + innerH + 4}" text-anchor="end" fill="#A9A7A2" font-size="13" font-family="JetBrains Mono, monospace">${yMinLabel}</text>
        <polyline points="${points}" fill="none" stroke="${opts.color || '#C1443B'}" stroke-width="2.5" />
        ${circles}
      </svg>`;
  }

  // ======================= MOVEMENT PICKER =======================
  // ======================= PR ENTRY HELPERS =======================
  // The lifts offered when entering a past personal record.
  const PR_LIFTS = [
    'Back Squat', 'Bench Press', 'Clean', 'Clean and Jerk', 'Front Squat', 'Overhead Squat',
    'Power Clean', 'Power Clean and Jerk', 'Power Snatch', 'Push Press', 'Snatch',
    'Snatch Balance', 'Strict Press', 'Unbroken Wall Balls',
  ];
  // Workout posts sometimes use a longer name for the same lift ("Full Snatch"). When a
  // record is entered for "Snatch", it should land on the same movement the workouts use,
  // so the entry screen and your records agree. Keys and values are normalized (see normName).
  const PR_ALIASES = {
    'snatch': ['full snatch', 'squat snatch'],
    'clean': ['full clean', 'squat clean'],
    'clean and jerk': ['full clean and jerk', 'squat clean and jerk'],
    'bench press': ['barbell bench press'],
    'strict press': ['shoulder press', 'strict shoulder press'],
  };
  function normName(n) {
    return String(n).toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
  }
  // Movements scored by most reps rather than heaviest 1RM. A 1RM estimate from a
  // 100-rep wall-ball set would be meaningless, so these are shown as "best reps".
  function isRepMaxMovement(name) {
    return isBodyweightMovement(name) || /wall.?ball/i.test(name);
  }
  async function resolveMovementId(displayName) {
    const { data: all, error } = await sb.from('movements').select('id, name');
    if (error) throw error;
    const want = normName(displayName);
    const candidates = [want, ...(PR_ALIASES[want] || [])];
    for (const c of candidates) {
      const hit = (all || []).find(m => normName(m.name) === c);
      if (hit) return hit.id;
    }
    const { data, error: insErr } = await sb.from('movements').insert({ name: displayName }).select().single();
    if (insErr) throw insErr;
    return data.id;
  }
  let prFlash = null; // one-time confirmation shown on the records page after saving

  const CUSTOM_TYPE_LABELS = {
    hyrox: 'Hyrox',
    zone2_machine: 'Zone 2 — Machine',
    zone2_run: 'Zone 2 — Run',
    conditioning: 'Conditioning',
    other: 'Other',
  };

  async function renderMovementPicker() {
    root.innerHTML = `${topBarHtml(false)}<div class="page-title">Movement History</div><div class="center-msg" style="margin-top:20px;">Loading…</div>`;
    wireTopBar();

    const { data, error } = await sb
      .from('strength_results').select('movement_id, movements(id, name)');
    if (error) {
      root.innerHTML = `${topBarHtml(false)}<div class="error-banner">${esc(error.message)}</div>`;
      wireTopBar();
      return;
    }

    const countsById = {};
    const namesById = {};
    (data || []).forEach(r => {
      if (!r.movements) return;
      countsById[r.movement_id] = (countsById[r.movement_id] || 0) + 1;
      namesById[r.movement_id] = r.movements.name;
    });

    const movementList = Object.keys(namesById)
      .map(id => ({ id, name: namesById[id], count: countsById[id] }))
      .sort((a, b) => a.name.localeCompare(b.name));

    // Custom workouts (Hyrox, Zone 2, etc.) — RLS already scopes this to your own entries.
    const { data: customSegs } = await sb
      .from('segments').select('custom_type').eq('source', 'custom').not('custom_type', 'is', null);
    const customCounts = {};
    (customSegs || []).forEach(s => {
      customCounts[s.custom_type] = (customCounts[s.custom_type] || 0) + 1;
    });
    const customList = Object.keys(customCounts)
      .map(type => ({ type, label: CUSTOM_TYPE_LABELS[type] || type, count: customCounts[type] }))
      .sort((a, b) => a.label.localeCompare(b.label));

    function draw(filterText) {
      const filteredMovements = filterText
        ? movementList.filter(m => m.name.toLowerCase().includes(filterText.toLowerCase()))
        : movementList;
      const filteredCustom = filterText
        ? customList.filter(c => c.label.toLowerCase().includes(filterText.toLowerCase()))
        : customList;

      const movementRowsHtml = filteredMovements.map(m =>
        `<button class="movement-row" data-kind="movement" data-id="${esc(m.id)}" data-name="${esc(m.name)}">
          <span class="mv-name">${esc(m.name)}</span>
          <span class="mv-count">${m.count} session${m.count === 1 ? '' : 's'}</span>
        </button>`
      ).join('');

      const customRowsHtml = filteredCustom.map(c =>
        `<button class="movement-row" data-kind="custom" data-type="${esc(c.type)}" data-label="${esc(c.label)}">
          <span class="mv-name">${esc(c.label)}</span>
          <span class="mv-count">${c.count} session${c.count === 1 ? '' : 's'}</span>
        </button>`
      ).join('');

      const nothingYet = !filteredMovements.length && !filteredCustom.length;

      root.innerHTML = `
        ${topBarHtml(false)}
        <div class="page-title">Movement History</div>
        <button class="movement-row pr-board-btn" id="prBoardBtn" type="button">
          <span class="mv-name">🏆 Personal Records</span>
          <span class="mv-count" style="color:var(--chalk);">all lifts →</span>
        </button>
        <input type="text" class="search-input" id="searchInput" placeholder="Search…" value="${esc(filterText || '')}">
        ${nothingYet ? `<div class="center-msg" style="margin-top:20px;font-size:19px;">Nothing logged yet.</div>` : ''}
        ${filteredMovements.length ? `<div class="section-label">Movements</div><div>${movementRowsHtml}</div>` : ''}
        ${filteredCustom.length ? `<div class="section-label">Custom Workouts</div><div>${customRowsHtml}</div>` : ''}
      `;
      wireTopBar();
      document.getElementById('prBoardBtn').onclick = () => renderPrBoard();
      const searchEl = document.getElementById('searchInput');
      searchEl.oninput = () => draw(searchEl.value);
      if (filterText !== undefined) {
        searchEl.focus();
        searchEl.setSelectionRange(searchEl.value.length, searchEl.value.length);
      }
      // Only rows that carry a data-kind are real lifts/custom workouts. The
      // Personal Records button shares the .movement-row styling but must keep
      // its own click action, so it's excluded here.
      document.querySelectorAll('.movement-row[data-kind]').forEach(btn => {
        btn.onclick = () => {
          if (btn.dataset.kind === 'custom') {
            renderCustomTypeDetail(btn.dataset.type, btn.dataset.label);
          } else {
            renderMovementDetail(btn.dataset.id, btn.dataset.name);
          }
        };
      });
    }
    draw('');
  }

  // ======================= MOVEMENT DETAIL =======================
  async function renderMovementDetail(movementId, movementName) {
    root.innerHTML = `${topBarHtml(true)}<div class="center-msg">Loading history…</div>`;
    wireTopBar(() => renderMovementPicker());

    const { data, error } = await sb
      .from('strength_results').select('*')
      .eq('movement_id', movementId).order('logged_at', { ascending: true });
    if (error) {
      root.innerHTML = `${topBarHtml(true)}<div class="error-banner">${esc(error.message)}</div>`;
      wireTopBar(() => renderMovementPicker());
      return;
    }
    const sessions = data || [];
    const isBodyweight = isRepMaxMovement(movementName); // bodyweight lifts and wall balls: best reps, not 1RM

    let html = `
      ${topBarHtml(true)}
      <div class="page-title">${esc(movementName)}</div>
      <div class="sub">${sessions.length} session${sessions.length === 1 ? '' : 's'} logged</div>
    `;

    if (!sessions.length) {
      html += `<div class="center-msg" style="margin-top:20px;">No sessions yet for this movement.</div>`;
      root.innerHTML = html;
      wireTopBar(() => renderMovementPicker());
      return;
    }

    // Cardio rounds (bike/row/ski/run) are identified by their data: they carry a
    // duration and/or calories rather than reps and pounds. A plain list is the
    // honest display — there's no "best" to rank.
    const isCardio = sessions.some(s => s.duration_seconds != null || s.calories != null);

    if (isCardio) {
      html += sessionListHtml(sessions, (s) => {
        const parts = [];
        if (s.duration_seconds != null) parts.push(fmtTime(s.duration_seconds));
        if (s.calories != null) parts.push(`${s.calories} cal`);
        return { val: parts.length ? parts.join(' · ') : 'Completed', isPR: false };
      });
    } else if (isBodyweight) {
      let bestRow = sessions[0];
      sessions.forEach(s => { if ((s.reps_completed || 0) > (bestRow.reps_completed || 0)) bestRow = s; });
      html += `
        <div class="best-card">
          <div class="best-label">All-time best</div>
          <div class="best-value">${bestRow.reps_completed} reps</div>
          <div class="best-sub">${fmtDate(bestRow.logged_at)}${bestRow.weight_lbs ? ` · ${bestRow.weight_lbs} lb` : ''}</div>
        </div>
        <div class="chart-card">${buildLineChartSvg(sessions.map(s => s.reps_completed || 0))}</div>
      `;
      html += sessionListHtml(sessions, (s) => {
        const isPR = s === bestRow;
        const val = `${s.reps_completed ?? '?'} reps${s.weight_lbs ? ` @ ${s.weight_lbs} lb` : ''}`;
        return { val, isPR };
      });
    } else {
      // Two records, deliberately kept apart:
      //   actual     = heaviest TRUE single (a lift you really did)
      //   calculated = highest Epley estimate from multi-rep sets (an extrapolation)
      let actualRow = null, calcRow = null, calcVal = null;
      sessions.forEach(s => {
        if (!s.weight_lbs || !s.reps_completed) return;
        if (s.reps_completed === 1) {
          if (!actualRow || s.weight_lbs > actualRow.weight_lbs) actualRow = s;
        } else {
          const est = epley(s.weight_lbs, s.reps_completed);
          if (calcVal === null || est > calcVal) { calcVal = est; calcRow = s; }
        }
      });
      const chartValues = sessions
        .filter(s => s.weight_lbs && s.reps_completed)
        .map(s => epley(s.weight_lbs, s.reps_completed));

      if (actualRow) {
        html += `
          <div class="best-card">
            <div class="best-label">Actual 1RM</div>
            <div class="best-value">${actualRow.weight_lbs} lb</div>
            <div class="best-sub">1 rep on ${fmtDate(actualRow.logged_at)}</div>
          </div>`;
      }
      if (calcRow) {
        html += `
          <div class="best-card est">
            <div class="best-label">Estimated 1RM (calculated)</div>
            <div class="best-value">${Math.round(calcVal)} lb</div>
            <div class="best-sub">from ${calcRow.reps_completed} reps @ ${calcRow.weight_lbs} lb on ${fmtDate(calcRow.logged_at)}</div>
          </div>`;
      }
      if (!actualRow && !calcRow) {
        html += `<div class="sub">No weighted sets with reps logged yet.</div>`;
      }
      html += chartValues.length > 1 ? `<div class="chart-card">${buildLineChartSvg(chartValues)}</div>` : '';
      html += sessionListHtml(sessions, (s) => {
        const val = `${s.reps_completed ?? '?'} reps @ ${s.weight_lbs ?? '?'} lb`;
        if (s === actualRow) return { val, isPR: true, prLabel: '1RM PR' };
        if (s === calcRow) return { val, isPR: true, prLabel: 'EST HIGH', est: true };
        return { val, isPR: false };
      });
    }

    root.innerHTML = html;
    wireTopBar(() => renderMovementPicker());

    root.querySelectorAll('[data-del-manual]').forEach(btn => {
      btn.onclick = async () => {
        if (!confirm('Remove this manually entered record?')) return;
        const { error: delErr } = await sb.from('strength_results').delete().eq('id', btn.dataset.delManual);
        if (delErr) { alert(delErr.message); return; }
        renderMovementDetail(movementId, movementName);
      };
    });
  }

  // ======================= PERSONAL RECORDS =======================
  // One list of every lift's records. Actual 1RM (a true single you really did)
  // is shown as the headline; an estimate is shown beneath, clearly labeled,
  // and never takes the headline spot from a real lift.
  async function renderPrBoard() {
    root.innerHTML = `${topBarHtml(true)}<div class="page-title">Personal Records</div><div class="center-msg" style="margin-top:20px;">Loading…</div>`;
    wireTopBar(() => renderMovementPicker());

    const { data, error } = await sb
      .from('strength_results').select('movement_id, reps_completed, weight_lbs, logged_at, movements(id, name)');
    if (error) {
      root.innerHTML = `${topBarHtml(true)}<div class="error-banner">${esc(error.message)}</div>`;
      wireTopBar(() => renderMovementPicker());
      return;
    }

    const byMovement = {};
    (data || []).forEach(r => {
      if (!r.movements || !r.reps_completed) return; // skips cardio rounds, which carry no reps
      const id = r.movement_id;
      if (!byMovement[id]) {
        byMovement[id] = { name: r.movements.name, actual: null, actualDate: null, calc: null, bestReps: 0, bestRepsDate: null, bestRepsWeight: null };
      }
      const m = byMovement[id];
      if (r.weight_lbs) {
        if (r.reps_completed === 1) {
          if (m.actual === null || r.weight_lbs > m.actual) { m.actual = r.weight_lbs; m.actualDate = r.logged_at; }
        } else {
          const est = epley(r.weight_lbs, r.reps_completed);
          if (m.calc === null || est > m.calc) m.calc = est;
        }
      }
      if (r.reps_completed > m.bestReps) {
        m.bestReps = r.reps_completed; m.bestRepsDate = r.logged_at; m.bestRepsWeight = r.weight_lbs || null;
      }
    });

    const all = Object.values(byMovement).sort((a, b) => a.name.localeCompare(b.name));
    const loaded = all.filter(m => !isRepMaxMovement(m.name) && (m.actual !== null || m.calc !== null));
    const bodyweight = all.filter(m => isRepMaxMovement(m.name) && m.bestReps > 0);

    const loadedRows = loaded.map(m => {
      const main = m.actual !== null
        ? `<div class="pr-main">${m.actual} lb</div><div class="pr-sub">actual 1RM · ${fmtDate(m.actualDate)}</div>`
        : `<div class="pr-main none">no actual 1RM yet</div>`;
      const est = m.calc !== null ? `<div class="pr-sub">est. ${Math.round(m.calc)} lb (calculated)</div>` : '';
      return `<div class="pr-row"><div class="pr-name">${esc(m.name)}</div><div class="pr-vals">${main}${est}</div></div>`;
    }).join('');

    const bodyweightRows = bodyweight.map(m =>
      `<div class="pr-row"><div class="pr-name">${esc(m.name)}</div>
        <div class="pr-vals"><div class="pr-main">${m.bestReps} reps</div><div class="pr-sub">${fmtDate(m.bestRepsDate)}${m.bestRepsWeight ? ` · ${m.bestRepsWeight} lb` : ''}</div></div></div>`
    ).join('');

    const flash = prFlash; prFlash = null;
    root.innerHTML = `
      ${topBarHtml(true)}
      <div class="page-title">Personal Records</div>
      ${flash ? `<div class="flash-ok">${esc(flash)}</div>` : ''}
      <button class="movement-row pr-board-btn" id="addPrBtn" type="button">
        <span class="mv-name">+ Enter a past PR</span>
        <span class="mv-count" style="color:var(--chalk);">→</span>
      </button>
      ${loadedRows ? `<div class="section-label">Lifts</div>${loadedRows}` : ''}
      ${bodyweightRows ? `<div class="section-label">Best reps</div>${bodyweightRows}` : ''}
      ${!loadedRows && !bodyweightRows ? `<div class="center-msg" style="margin-top:20px;">No records yet. Enter one above, or log a workout.</div>` : ''}
    `;
    wireTopBar(() => renderMovementPicker());
    document.getElementById('addPrBtn').onclick = () => renderPrEntry();
  }

  // ======================= ENTER A PERSONAL RECORD =======================
  // For a lift you've already done but never logged here — e.g. "my back squat PR is 395".
  // It's saved like any other set, but tied to no workout, so it counts toward your
  // records and history without appearing in any day's results.
  const OTHER_LIFT = '__other__';
  const CARDIO_NAME_PATTERNS = [
    /\bbike(\s*erg)?\b/i, /\bski(\s*erg)?\b/i,
    /^\s*(calorie\s+|cal\s+|meter\s+)?(row|rower|rowing|run|running|jog|jogging|swim|swimming)(\s+erg)?\s*$/i,
  ];
  // "pause squat" -> "Pause Squat" so new lifts match the style of the others.
  // A name the person capitalized themselves is left exactly as typed.
  function tidyLiftName(raw) {
    const name = String(raw).replace(/\s+/g, ' ').trim();
    return name === name.toLowerCase() ? name.replace(/\b[a-z]/g, c => c.toUpperCase()) : name;
  }

  async function renderPrEntry(errorMsg, prefill) {
    const p = prefill || {};
    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

    // Suggestions for "Other lift": movements that already exist, so a typed name
    // lines up with the one the workouts use instead of creating a near-duplicate.
    let suggestions = [];
    try {
      const { data } = await sb.from('movements').select('id, name');
      const curated = new Set(PR_LIFTS.map(normName));
      suggestions = (data || []).map(m => m.name)
        .filter(n => !curated.has(normName(n)) && !CARDIO_NAME_PATTERNS.some(pt => pt.test(n)))
        .sort((a, b) => a.localeCompare(b));
    } catch (e) { /* suggestions are a convenience only */ }

    root.innerHTML = `
      ${topBarHtml(true)}
      <div class="page-title" style="font-size:32px;">Enter a Past PR</div>
      <div class="sub">Add a lift you've already done. It counts toward your records right away.</div>
      ${errorMsg ? `<div class="error-banner">${esc(errorMsg)}</div>` : ''}

      <label class="form-label" for="prLift">Lift</label>
      <select id="prLift" class="form-input">
        ${PR_LIFTS.map(n => `<option value="${esc(n)}"${p.lift === n ? ' selected' : ''}>${esc(n)}</option>`).join('')}
        <option value="${OTHER_LIFT}"${p.lift === OTHER_LIFT ? ' selected' : ''}>Other lift…</option>
      </select>
      <div id="prCustomWrap" style="display:${p.lift === OTHER_LIFT ? 'block' : 'none'};margin-top:10px;">
        <input type="text" id="prCustomName" class="form-input" list="prLiftSuggestions" maxlength="60"
               placeholder="Name of the lift" autocomplete="off" value="${esc(p.custom || '')}">
        <datalist id="prLiftSuggestions">${suggestions.map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist>
      </div>

      <div class="score-row" style="margin-top:14px;">
        <div class="score-field"><label for="prWeight">Weight (lb)</label><input type="number" id="prWeight" inputmode="decimal" min="0" placeholder="395" value="${esc(p.weight ?? '')}"></div>
        <div class="score-field"><label for="prReps">Reps</label><input type="number" id="prReps" inputmode="numeric" min="1" value="${esc(p.reps ?? 1)}"></div>
      </div>
      <div class="sub" style="margin:8px 0 0;font-size:16px;">1 rep counts as an actual 1RM. More than 1 rep is used to calculate an estimated 1RM.</div>

      <label class="form-label" for="prDate" style="margin-top:14px;">Date</label>
      <input type="date" id="prDate" class="form-input" value="${esc(p.date || todayStr)}" max="${todayStr}">

      <label class="form-label" for="prNotes" style="margin-top:14px;">Notes (optional)</label>
      <input type="text" id="prNotes" class="form-input" placeholder="e.g. competition, belt used, how it felt" value="${esc(p.notes || '')}">

      <button class="log-btn" id="savePrBtn" style="margin-top:22px;">Save record</button>
    `;
    wireTopBar(() => renderPrBoard());

    const sel = document.getElementById('prLift');
    sel.onchange = () => {
      document.getElementById('prCustomWrap').style.display = sel.value === OTHER_LIFT ? 'block' : 'none';
      if (sel.value === OTHER_LIFT) document.getElementById('prCustomName').focus();
    };

    document.getElementById('savePrBtn').onclick = async () => {
      // Remember what was typed so a validation message never wipes the form
      const entered = {
        lift: sel.value,
        custom: document.getElementById('prCustomName').value,
        weight: document.getElementById('prWeight').value,
        reps: document.getElementById('prReps').value,
        date: document.getElementById('prDate').value,
        notes: document.getElementById('prNotes').value,
      };
      let lift = entered.lift;
      if (lift === OTHER_LIFT) {
        lift = tidyLiftName(entered.custom);
        if (!lift) return renderPrEntry('Type the name of the lift.', entered);
      }
      const weight = parseFloat(entered.weight);
      const reps = parseInt(entered.reps, 10);
      const notes = entered.notes.trim() || null;
      // Bodyweight lifts and wall balls are records of reps, so weight is optional for them
      const weightRequired = !isRepMaxMovement(lift);

      if (weightRequired && !(weight > 0)) return renderPrEntry('Enter the weight you lifted.', entered);
      if (!(reps >= 1)) return renderPrEntry('Reps must be at least 1.', entered);
      if (!entered.date) return renderPrEntry('Pick the date you did it.', entered);
      if (entered.date > todayStr) return renderPrEntry('That date is in the future.', entered);

      document.getElementById('savePrBtn').disabled = true;
      try {
        const weightVal = weight > 0 ? weight : null;
        const movementId = await resolveMovementId(lift);
        const [y, m, d] = entered.date.split('-').map(Number);
        const { error } = await sb.from('strength_results').insert({
          movement_id: movementId,
          set_number: 1,
          reps_completed: reps,
          weight_lbs: weightVal,
          notes,
          // noon local time keeps the date correct in every timezone
          logged_at: new Date(y, m - 1, d, 12, 0, 0).toISOString(),
        });
        if (error) throw error;
        prFlash = weightVal
          ? `Saved: ${lift} — ${weightVal} lb × ${reps}${reps === 1 ? ' (actual 1RM)' : ''}`
          : `Saved: ${lift} — ${reps} reps`;
        renderPrBoard();
      } catch (e) {
        renderPrEntry(e.message || String(e), entered);
      }
    };
  }

  // ======================= CUSTOM WORKOUT TYPE DETAIL =======================
  // Hyrox, Zone 2, Conditioning, etc. — scored the opposite way from strength
  // lifts: lower time is better, so "best" here means fastest, not heaviest.
  async function renderCustomTypeDetail(customType, label) {
    root.innerHTML = `${topBarHtml(true)}<div class="center-msg">Loading history…</div>`;
    wireTopBar(() => renderMovementPicker());

    const { data: segs, error } = await sb
      .from('segments').select('id, title, workouts(workout_date)')
      .eq('source', 'custom').eq('custom_type', customType);
    if (error) {
      root.innerHTML = `${topBarHtml(true)}<div class="error-banner">${esc(error.message)}</div>`;
      wireTopBar(() => renderMovementPicker());
      return;
    }

    const segIds = (segs || []).map(s => s.id);
    let results = [];
    if (segIds.length) {
      const { data } = await sb.from('wod_results').select('*').in('segment_id', segIds);
      results = data || [];
    }

    const sessions = results.map(r => {
      const seg = (segs || []).find(s => s.id === r.segment_id);
      return {
        workout_date: seg && seg.workouts ? seg.workouts.workout_date : null,
        title: seg ? seg.title : label,
        time_seconds: r.time_seconds,
        notes: r.notes,
      };
    }).sort((a, b) => (a.workout_date || '').localeCompare(b.workout_date || ''));

    let html = `
      ${topBarHtml(true)}
      <div class="page-title">${esc(label)}</div>
      <div class="sub">${sessions.length} session${sessions.length === 1 ? '' : 's'} logged — different format each time, so shown chronologically rather than ranked</div>
    `;

    if (!sessions.length) {
      html += `<div class="center-msg" style="margin-top:20px;">No sessions yet.</div>`;
      root.innerHTML = html;
      wireTopBar(() => renderMovementPicker());
      return;
    }

    const rows = sessions.slice().reverse().map(s => {
      return `<div class="session-row">
        <span class="s-date">${fmtDate(s.workout_date)}</span>
        <span class="s-val">${fmtTime(s.time_seconds)}${s.notes ? `<span class="s-notes">${esc(s.notes)}</span>` : ''}</span>
      </div>`;
    }).join('');
    html += `<div>${rows}</div>`;

    root.innerHTML = html;
    wireTopBar(() => renderMovementPicker());
  }

  function sessionListHtml(sessions, describe) {
    const rows = sessions.slice().reverse().map(s => {
      const { val, isPR, prLabel, est } = describe(s);
      const tag = isPR ? `<span class="s-pr${est ? ' s-est' : ''}">${esc(prLabel || 'PR')}</span>` : '';
      // A record entered by hand has no workout. Say so, and let it be removed if mistyped.
      const manual = s.segment_id == null && s.id != null
        ? `<span class="s-notes">entered manually · <button class="nav-link-btn" data-del-manual="${s.id}" type="button">remove</button></span>`
        : '';
      return `<div class="session-row">
        <span class="s-date">${fmtDate(s.logged_at)}</span>
        <span class="s-val">${val}${tag}${s.notes ? `<span class="s-notes">${esc(s.notes)}</span>` : ''}${manual}</span>
      </div>`;
    }).join('');
    return `<div>${rows}</div>`;
  }

  // ======================= MAIN =======================
  async function main() {
    const { data: sessionData } = await sb.auth.getSession();
    if (!sessionData.session) {
      root.innerHTML = `<div class="center-msg">Not signed in.<br><br><a href="index.html" style="color:#F2EFE9;">Go to the main app to sign in</a>, then come back here.</div>`;
      return;
    }
    renderMovementPicker();
  }

  main();
</script>
</body>
</html>
